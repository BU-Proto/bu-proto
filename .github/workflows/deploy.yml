# Every push to main builds the site, applies new D1 migrations to production, then deploys the
# Worker. If lint, build or a migration fails, the job stops and nothing is deployed.
#
# Needs the CLOUDFLARE_API_TOKEN repository secret (see "Deploys" in the README).
# Runtime secrets (GOOGLE_CLIENT_ID, TURNSTILE_SECRET_KEY, ...) live on the Worker in Cloudflare;
# `wrangler deploy` never deletes them, and this workflow doesn't touch them. The public Turnstile
# site key is committed in .env.production, which `npm run build` reads.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deploy at a time. A newer push waits for the running one to finish instead of
# cancelling it, so a migration is never cut off halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build, migrate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://buproto.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # `wrangler d1 migrations apply --remote` ignores account_id in the config, so set it here.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '0bda3a2560ca48711ef7336cc421abed' }}
      # Wrangler answers its confirmation prompts with "yes" when CI is set (GitHub sets it too).
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        shell: bash

    steps:
      - name: Check the Cloudflare token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing secret::Add CLOUDFLARE_API_TOKEN under Settings > Secrets and variables > Actions. See 'Deploys' in the README."
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Apply D1 migrations to production (bu-proto)
        run: |
          echo "::group::Migrations already on the production database"
          npx wrangler d1 migrations list DB --remote
          echo "::endgroup::"
          echo "Applying any new files in migrations/ ..."
          npx wrangler d1 migrations apply DB --remote
          echo "Migrations are up to date."

      - name: Deploy the Worker
        run: npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"

      - name: Deployed version
        run: |
          version=$(grep -oE 'Current Version ID: [0-9a-f-]+' "$RUNNER_TEMP/deploy.log" | awk '{print $4}' | tail -n1)
          echo "Deployed version: ${version:-unknown}"
          npx wrangler deployments status
          {
            echo "### Deployed bu-proto"
            echo ""
            echo "- Version: \`${version:-unknown}\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Site: https://buproto.com"
          } >> "$GITHUB_STEP_SUMMARY"
