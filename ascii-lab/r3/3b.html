<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r3/3b Poster and sticker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #061a2e; overflow: hidden; }
  body { display: grid; place-items: center; }
  #w { position: relative; width: min(100vw, 100vh); height: min(100vw, 100vh); container-type: size; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .t { position: absolute; color: #f6fbff; font: 700 1em ui-monospace, Menlo, Consolas, monospace; letter-spacing: .04em; white-space: nowrap; }
  #title { left: 6cqw; top: 6cqw; font-size: 9cqw; line-height: 1; }
  #sub { left: 6.4cqw; top: 17.5cqw; font-size: 2.3cqw; font-weight: 400; color: #7cc7f4; }
  #foot { left: 6.4cqw; bottom: 5cqw; font-size: 1.9cqw; font-weight: 400; color: #b6aaff; }
  #st { left: 60cqw; top: 60cqw; width: 0; height: 0; transform: rotate(-6deg); }
  #st span { position: absolute; transform: translate(-50%, -50%); }
  #st .a { top: 11cqw; font-size: 9.5cqw; line-height: 1; }
  #st .b { top: 17.5cqw; font-size: 2.1cqw; font-weight: 400; color: #061a2e; background: #f4a2c0; padding: .5cqw 1.4cqw; border-radius: 1cqw; }
</style>
</head>
<body>
<div id="w">
<canvas id="c"></canvas>
<div class="t" id="title">BU PROTO</div>
<div class="t" id="sub">builders on trov</div>
<div class="t" id="foot">boston university</div>
<div class="t" id="st"><span class="a">BU</span><span class="b">PROTO</span></div>
</div>
<script src="../kit/palette.js"></script>
<script>
/* Same material as r2/1e: five marks built in the shader, one height field whose contours set stroke angle,
   a rose-led hue field, peach rim, frost peak, mint cursor. Here the square is a poster, and a die-cut sticker
   (frost margin, slight tilt, soft shadow) sits on it carrying the same engraving at a different phase. */
(function () {
  'use strict';
  var P = LabPalette;
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv = document.getElementById('c'), box = document.getElementById('w');
  var gl = cv.getContext('webgl2', { antialias: false, alpha: false });
  var VS = '#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  var FS = [
'#version 300 es',
'precision highp float;',
'uniform vec2 R; uniform float T; uniform vec2 cell; uniform sampler2D lut;',
'out vec4 o;',
'const vec3 HARBOR=vec3(.0235,.1020,.1804), RAISED=vec3(.0431,.1647,.2745);',
'const vec3 FROST=vec3(.9647,.9843,1.), PEACH=vec3(.9725,.5725,.5412), MINT=vec3(.6157,.9412,.6588);',
'const float PI=3.14159265;',
'float hgt(vec2 q,float t){',
'  q+=.30*vec2(sin(q.y*2.1+t*.16+1.3),cos(q.x*1.7-t*.13));',
'  float a=sin(q.x*2.4+1.6*sin(q.y*1.8+t*.1)+t*.15);',
'  float c=sin(length(q-vec2(.25,-.1))*4.6-t*.28);',
'  return .5+.5*(.6*a+.4*c);',
'}',
'float seg(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h);}',
'vec2 rot(vec2 p,float a){float c=cos(a),s=sin(a);return vec2(c*p.x+s*p.y,-s*p.x+c*p.y);}',
'float line(vec2 p,float a,float hl){vec2 d=vec2(cos(a),sin(a))*hl;return seg(p,-d,d);}',
'float glyph(vec2 p,float lv,float a){',
'  if(lv<1.5) return length(p)-.02;',
'  if(lv<2.5) return line(p,a,.14);',
'  if(lv<3.5) return line(p,a,.40);',
'  if(lv<4.5) return min(line(p,a,.40),line(p,a+PI*.5,.22));',
'  vec2 r=abs(rot(p,a))-vec2(.40,.15); return length(max(r,0.))+min(max(r.x,r.y),0.)+.03;',
'}',
'float sdRB(vec2 p,vec2 b,float r){vec2 d=abs(p)-b+r;return length(max(d,0.))+min(max(d.x,d.y),0.)-r;}',
'vec3 ramp(float t){return texture(lut,vec2(clamp(t,0.,1.)*.998+.001,.5)).rgb;}',
/* the engraving: q field coords, p in-cell coords, mask scales tone, hb shifts hue toward rose */
'vec3 eng(vec2 q,vec2 p,vec2 id,float t,float mask,float hb,vec3 gnd,float pxu){',
'  float e=.012;',
'  float h=hgt(q,t);',
'  float gx=hgt(q+vec2(e,0.),t)-hgt(q-vec2(e,0.),t);',
'  float gy=hgt(q+vec2(0.,e),t)-hgt(q,t)+hgt(q,t)-hgt(q-vec2(0.,e),t);',
'  float ang=atan(gy,gx)+PI*.5;',
'  float tone=clamp(smoothstep(.2,.9,h)*mask,0.,1.);',
'  float hu=clamp(.42+hb+.5*smoothstep(.1,.95,h),0.,1.);',
'  hu=mix(hu,.1,smoothstep(.8,1.,-q.x*.6-q.y*.7+.3)*.6);',
'  hu=mix(hu,.84,smoothstep(.8,.95,tone)*.5);',
'  vec3 col=ramp(hu);',
'  float lv=clamp(floor(tone*5.6-.3),0.,5.);',
'  float d=lv>.5?glyph(p,lv,ang):1e3;',
'  float cov=1.-smoothstep(.04-pxu*.8,.04+pxu*.8,d);',
'  vec3 ink=col;',
'  if(tone>.8) ink=mix(col,PEACH,smoothstep(.85,.95,tone)*.5); if(tone>.95) ink=mix(ink,FROST,smoothstep(.95,.995,tone));',
'  return mix(gnd,ink,cov);',
'}',
'void main(){',
'  vec2 px=gl_FragCoord.xy; px.y=R.y-px.y;',
'  vec2 id=floor(px/cell); vec2 f=(px-id*cell)/cell-.5;',
'  vec2 cc=(id+.5)*cell;',
'  float ca=cell.y/cell.x; vec2 p=f*vec2(1./ca,1.);',
'  float pxu=1./cell.y;',
'  vec2 uv=cc/R;',
/* sticker frame (rotated -6 deg about its centre), in cell-centre and pixel space */
'  float rs=-.1047, cs=cos(rs), sn=sin(rs);',
'  vec2 sc=vec2(.60,.60);',
'  vec2 su=uv-sc; su=vec2(cs*su.x+sn*su.y,-sn*su.x+cs*su.y);',
'  float ds=sdRB(su,vec2(.27,.27),.09);',
'  vec2 pu=px/R-sc; pu=vec2(cs*pu.x+sn*pu.y,-sn*pu.x+cs*pu.y);',
'  float dp=sdRB(pu,vec2(.27,.27),.09);',
/* poster */
'  vec2 q=(uv-.5)*2.;',
'  float vig=smoothstep(1.6,.2,length(q));',
'  float quiet=smoothstep(.0,.9,length(vec2(uv.x-.05,uv.y-.12)*vec2(1.,1.3)))*.7+.3;',
'  float shade=smoothstep(.0,.16,ds+.02);',     /* poster field fades into the sticker's shadow */
'  float mP=(.5+.5*vig)*quiet*mix(.35,1.,shade);',
'  vec3 gnd=mix(HARBOR,RAISED,smoothstep(1.4,.0,length(q))*.7);',
'  vec3 c=eng(q,p,id,T+6.,mP,0.,gnd,pxu);',
/* soft drop shadow under sticker */
'  vec2 pu2=pu-vec2(.012,.016);',
'  float sh=sdRB(pu2,vec2(.27,.27),.09);',
'  c=mix(c,HARBOR,(1.-smoothstep(-.01,.07,sh))*.55*step(.0,dp));',
/* sticker body: frost margin, raised plate, denser engraving, text-free band at the lower left */
'  vec2 sq=su*3.4;',
'  float mS=.8+.15*smoothstep(.5,.0,length(su+vec2(-.04,.06)));',
'  mS*=1.-.97*smoothstep(.0,.03,su.y)*smoothstep(.25,.2,su.y)*smoothstep(.2,.14,abs(su.x));',
'  vec3 sg=mix(RAISED,vec3(.0706,.2275,.3608),smoothstep(.3,-.3,su.y)*.6);',
'  vec3 cs2=eng(sq+vec2(.2,.5),p,id,T+2.,clamp(mS,0.,1.2),.1,sg,pxu);',
'  float rim=1.-smoothstep(-.002,.002,dp);',
'  float edge=1.-smoothstep(.0,.004,abs(dp+.03));',
'  c=mix(c,FROST,rim*.97);',
'  c=mix(c,cs2,smoothstep(.0,.003,-(dp+.024)));',
'  c=mix(c,PEACH*.9+FROST*.1,edge*.35*smoothstep(.0,.003,-(dp+.022)));',
/* mint cursor, live, wanders on the poster only */
'  vec2 mc=floor((vec2(.5+.34*sin(T*.23),.5+.3*sin(T*.31+1.))*R)/cell);',
'  if(ds>.03&&(id==mc||id==mc+vec2(1.,0.))){',
'    float dm=min(line(p,0.,.4),line(p,PI*.5,.28));',
'    c=mix(c,MINT,(1.-smoothstep(.04-pxu,.04+pxu,dm))*(.6+.4*step(.5,fract(T*1.4))));',
'  }',
'  o=vec4(c,1.);',
'}'].join('\n');
  function sh(type, src) {
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  var pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(pr); gl.useProgram(pr);
  var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  var tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 256, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, P.lut(256));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  var uR = gl.getUniformLocation(pr, 'R'), uT = gl.getUniformLocation(pr, 'T'), uC = gl.getUniformLocation(pr, 'cell');
  gl.uniform1i(gl.getUniformLocation(pr, 'lut'), 0);
  function size() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var s = Math.round(box.clientWidth);
    cv.width = Math.round(s * dpr); cv.height = Math.round(s * dpr);
    var cw = Math.max(9, Math.round(s / 80)) * dpr;
    gl.viewport(0, 0, cv.width, cv.height);
    gl.uniform2f(uR, cv.width, cv.height);
    gl.uniform2f(uC, cw, Math.round(cw * 1.8));
  }
  function draw(t) { gl.uniform1f(uT, t); gl.drawArrays(gl.TRIANGLES, 0, 3); }
  size(); draw(0);
  addEventListener('resize', function () { size(); draw(0); });
  if (!still) (function loop(ms) { draw(ms / 1000); requestAnimationFrame(loop); })(0);
})();
</script>
</body>
</html>
