<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>2b Poster and Sticker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #061a2e; overflow: hidden; }
  canvas { position: fixed; left: 50%; top: 50%; display: block; transform: translate(-50%, -50%); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../kit/palette.js"></script>
<script src="../kit/subjects.js"></script>
<script>
/* Square poster plus die-cut sticker, same material as 7e: nine-stop ladder, two pure inks per cell,
   Bayer tie-break, no interpolation, harbor ground with no glyphs. The sticker is a smaller field of the
   same mushroom cut into a frost-edged disc, tilted, with a drop shadow. One mint live cell on the poster. */
(function () {
  'use strict';
  var Pal = LabPalette, S = LabSubjects;
  var cv = document.getElementById('c'), cx = cv.getContext('2d');
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var FONT = 'ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace';
  var LADDER = ['harbor', 'raised', 'raisedHi', 'cerulean', 'irisDeep', 'raspberry', 'rose', 'peach', 'frost']
    .map(function (k) { return Pal.toCss(Pal.resolve(k)); });
  var mintC = Pal.toCss(Pal.resolve('mint')), frostC = LADDER[8], roseC = Pal.toCss(Pal.resolve('rose'));
  var raisedC = LADDER[1];
  var SZ, dpr, unit, cols = 120, rows = 120, buf, sbuf, scols = 44, GL = [];
  var BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

  function buildAtlas() {
    var s = 32, c = document.createElement('canvas'); c.width = c.height = s;
    var g = c.getContext('2d', { willReadFrequently: true }), set = ' .:+x*o%#', out = [];
    for (var i = 0; i < set.length; i++) {
      g.clearRect(0, 0, s, s); g.fillStyle = '#fff'; g.font = '700 ' + s + 'px ' + FONT;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      if (set[i] !== ' ') g.fillText(set[i], s / 2, s / 2 + s * 0.04);
      var d = g.getImageData(0, 0, s, s).data, a = 0;
      for (var k = 3; k < d.length; k += 4) a += d[k];
      out.push({ ch: set[i], cov: a / 255 / (s * s) });
    }
    out.sort(function (p, q) { return p.cov - q.cov; });
    var mx = out[out.length - 1].cov;
    for (var j = 0; j < out.length; j++) out[j].cov /= mx * 1.02;
    out.push({ ch: '#', cov: 1, block: true });
    GL = out;
  }
  function pick(f) {
    var best = 0, bd = 9;
    for (var i = 0; i < GL.length; i++) { var d = Math.abs(GL[i].cov - f); if (d < bd) { bd = d; best = i; } }
    return GL[best];
  }
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    SZ = Math.floor(Math.min(window.innerWidth, window.innerHeight));
    cv.width = Math.round(SZ * dpr); cv.height = Math.round(SZ * dpr);
    cv.style.width = SZ + 'px'; cv.style.height = SZ + 'px';
    unit = SZ / cols;
    buf = S.create(cols, rows, 1);
    sbuf = S.create(scols, scols, 1);
  }

  /* draw one field into the current transform, origin at (0,0), cell size u */
  function field(b, nc, nr, u, t, mint) {
    var n = LADDER.length - 1, liveIdx = -1;
    if (mint) {
      var cand = [];
      for (var q = 0; q < nc * nr; q += 3) if (b.edge[q] > 0.75 && b.lum[q] > 0.5) cand.push(q);
      if (cand.length) liveIdx = cand[Math.floor(t * 0.5) % cand.length];
    }
    var fs = u * 1.05, sx = u / (fs * 0.6);
    cx.font = '700 ' + fs + 'px ' + FONT; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    for (var y = 0; y < nr; y++) {
      for (var x = 0; x < nc; x++) {
        var i = y * nc + x, L = b.lum[i], hint = b.hint[i];
        var s = Math.pow(Math.min(1, L * 1.08), 1.45) * (0.64 + 0.46 * hint);
        s = Math.min(1, Math.max(0, s));
        if (L < 0.16) s *= Math.pow(L / 0.16, 2);
        var p = s * n, k = Math.min(n - 1, Math.floor(p)), f = p - k;
        f += ((BAY[(y & 3) * 4 + (x & 3)] + 0.5) / 16 - 0.5) * 0.1;
        f = Math.min(1, Math.max(0, f));
        var px = x * u, py = y * u;
        if (k > 0) { cx.fillStyle = LADDER[k]; cx.fillRect(px, py, u + 0.5, u + 0.5); }
        if (i === liveIdx) {
          cx.fillStyle = LADDER[0]; cx.fillRect(px, py, u + .5, u + .5);
          cx.fillStyle = mintC; cx.fillText('*', px + u / 2, py + u / 2); continue;
        }
        if (f < 0.06) continue;
        var g = pick(f);
        if (g.ch === ' ') continue;
        cx.fillStyle = LADDER[k + 1];
        if (g.block) { cx.fillRect(px, py, u + 0.5, u + 0.5); continue; }
        cx.save(); cx.translate(px + u / 2, py + u / 2 + u * 0.04); cx.scale(sx, 1);
        cx.fillText(g.ch, 0, 0); cx.restore();
      }
    }
  }

  function frame(tm) {
    var t = still ? 6 : tm / 1000 * 0.25;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.fillStyle = LADDER[0]; cx.fillRect(0, 0, SZ, SZ);
    /* poster: crop is the whole square, mushroom cap rim carries the rose */
    S.fill('mushroom', buf, t);
    field(buf, cols, rows, unit, t, true);

    /* poster type, quiet zone bottom-left */
    var m = SZ * 0.06;
    cx.textAlign = 'left'; cx.textBaseline = 'alphabetic';
    cx.fillStyle = frostC; cx.font = '700 ' + (SZ * 0.075) + 'px ' + FONT;
    cx.fillText('BU PROTO', m, SZ - m - SZ * 0.035);
    cx.fillStyle = roseC; cx.font = '400 ' + (SZ * 0.02) + 'px ' + FONT;
    cx.fillText('BUILDERS / BOSTON UNIVERSITY', m, SZ - m);

    /* sticker: disc, frost die-cut edge, tilted, shadow */
    var R = SZ * 0.15, cxs = SZ * 0.82, cys = SZ * 0.83;
    cx.save(); cx.translate(cxs, cys); cx.rotate(-0.14);
    cx.fillStyle = 'rgba(2,10,20,0.55)'; cx.beginPath(); cx.arc(SZ * 0.008, SZ * 0.014, R + SZ * 0.012, 0, 6.2832); cx.fill();
    cx.fillStyle = frostC; cx.beginPath(); cx.arc(0, 0, R + SZ * 0.012, 0, 6.2832); cx.fill();
    cx.save(); cx.beginPath(); cx.arc(0, 0, R, 0, 6.2832); cx.clip();
    cx.fillStyle = LADDER[0]; cx.fillRect(-R, -R, 2 * R, 2 * R);
    S.fill('mushroom', sbuf, t + 2);
    cx.translate(-R, -R);
    var su = (2 * R) / scols;
    field(sbuf, scols, scols, su, t, false);
    cx.restore();
    /* wordmark band on the sticker, harbor on rose */
    cx.save(); cx.beginPath(); cx.arc(0, 0, R, 0, 6.2832); cx.clip();
    cx.fillStyle = roseC; cx.fillRect(-R, R * 0.52, 2 * R, R);
    cx.fillStyle = LADDER[0]; cx.font = '700 ' + (R * 0.24) + 'px ' + FONT;
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText('BU PROTO', 0, R * 0.72);
    cx.restore();
    cx.restore();
  }
  var last = 0;
  function loop(tm) { if (tm - last > 66) { last = tm; frame(tm); } requestAnimationFrame(loop); }
  buildAtlas(); resize();
  window.addEventListener('resize', function () { resize(); frame(performance.now()); });
  if (still) frame(0); else requestAnimationFrame(loop);
})();
</script>
</body>
</html>
