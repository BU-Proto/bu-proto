<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>2c Mushroom Sign</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #061a2e; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../kit/palette.js"></script>
<script src="../kit/subjects.js"></script>
<script>
/* Partitive colour, stripped. Every cell is two pure palette stops: a flat tile and a glyph of its ladder
   neighbour, glyph chosen by measured coverage so coverage is the mix ratio. Nothing is interpolated.
   Cut from the parent: the lens, the cool ladder, the line-glyph bias, the pointer. What remains: one ladder,
   a short glyph set, a quiet ground that is plain harbor, and a single live mint cell. */
(function () {
  'use strict';
  var Pal = LabPalette, S = LabSubjects;
  var cv = document.getElementById('c'), cx = cv.getContext('2d');
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var FONT = 'ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace';
  var LADDER = ['harbor', 'raised', 'raisedHi', 'cerulean', 'irisDeep', 'raspberry', 'rose', 'peach', 'frost']
    .map(function (k) { return Pal.toCss(Pal.resolve(k)); });
  var mintC = Pal.toCss(Pal.resolve('mint'));
  var W, H, dpr, unit, cols, rows, buf, GL = [];


  /* The mark: a front-view Proto mushroom sign, drawn analytically at cell resolution. Dome with a rim that
     glows like thin translucent tissue, a gill plate of radial lines, spots, a flared stem, a cerulean halo
     and a thin ring badge. Output fields match LabSubjects buffers (lum, hint, edge, mask). */
  function sm(a, b, x) { x = Math.min(1, Math.max(0, (x - a) / (b - a))); return x * x * (3 - 2 * x); }
  var SPOTS = [[-0.26, 0.3, 0.075], [0.02, 0.4, 0.06], [0.27, 0.27, 0.085], [-0.04, 0.18, 0.04], [0.43, 0.12, 0.045], [-0.44, 0.13, 0.05]];
  function sign(b, t) {
    var w = b.width, h = b.height, i = 0, sc = 1.12;
    var sway = 0.012 * Math.sin(t * 0.5), lx = 0.55 + 0.1 * Math.sin(t * 0.3);
    var cyc = 0.05, A = 0.64, B = 0.5, C = 0.1;
    for (var row = 0; row < h; row++) {
      var y = (1 - (row + 0.5) / h * 2) * sc;
      for (var col = 0; col < w; col++, i++) {
        var x = ((col + 0.5) / w * 2 - 1) * (w / h) * sc;
        var xs = x - sway * (y + 0.8);
        var lum = 0.04, hint = 0.45, edge = 0, mask = 0;
        /* halo: dome ellipse distance outside */
        var dy = y - cyc;
        var dd = Math.sqrt(xs * xs / (A * A) + dy * dy / (B * B));
        var dDome = dy > -0.1 ? Math.max(dd - 1, 0) * B : Math.max(Math.sqrt(xs * xs / (A * A) + (dy + 0.04) * (dy + 0.04) / (C * C)) - 1, 0) * C;
        var dStem = Math.max(Math.abs(xs) - 0.13, 0) + Math.max(-y - 0.84, 0) + Math.max(y - cyc, 0);
        var halo = 0.5 * Math.exp(-Math.min(dDome, dStem * 1.3) * 7);
        lum += halo * (0.6 + 0.4 * sm(-0.6, 1, xs * 0.9 + y * 0.5 + (lx - 0.55)));
        hint = 0.35 + 0.4 * halo;
        /* ring badge */
        var rr = Math.sqrt(x * x + y * y), ang = Math.atan2(y, x);
        var ringA = Math.exp(-Math.pow((rr - 0.98) / 0.02, 2)) * (Math.sin(ang * 9 + 0.5) > -0.2 ? 1 : 0);
        if (ringA > 0.4) { lum = Math.max(lum, 0.36); hint = 0.3; }
        /* stem */
        var sv = -y;
        if (sv > 0.0 && sv < 0.84) {
          var cx0 = 0.02 * Math.sin(sv * 3.1);
          var sw = 0.115 + 0.02 * sv + 0.2 * sm(0.5, 0.84, sv);
          var k = (xs - cx0) / sw;
          if (Math.abs(k) < 1) {
            var kk = k * k;
            var sl = 0.34 + 0.5 * kk * kk + 0.14 * sm(-0.6, 1, k) + 0.06 * Math.sin(sv * 40 + k * 3);
            sl *= 1 - 0.55 * sm(0.0, 0.18, 0.16 - sv);   /* shaded under the gills */
            lum = sl; hint = 0.55 + 0.4 * kk; edge = sm(0.7, 1, Math.abs(k)); mask = 1;
          }
        }
        /* gill plate */
        var pr = Math.sqrt(xs * xs / (A * A) + (dy + 0.04) * (dy + 0.04) / (C * C));
        if (y <= cyc + 0.0 && pr < 1) {
          var th = Math.atan2(dy + 0.04, xs / A * 1.0);
          var gl = 0.5 + 0.5 * Math.sin(xs / Math.max(0.05, 0.12 + 0.0) * 6.5 + (dy + 0.04) * 20 * xs);
          var g2 = 0.5 + 0.5 * Math.sin(Math.atan2(-(dy + 0.04) * 3, xs) * 0 + (xs * 52));
          var stripe = sm(0.1, 0.7, g2);
          var rim = sm(0.78, 1, pr);
          var pl = 0.2 + 0.26 * stripe + 0.4 * rim * (0.5 + 0.5 * sm(-0.8, 0.9, xs));
          lum = pl; hint = 0.7 + 0.3 * rim; edge = rim; mask = 1;
        }
        /* dome */
        if (dy > -0.02 && dd < 1) {
          var d3 = dd * dd * dd;
          var light = sm(-0.9, 0.9, xs * 0.8 + dy * 0.7 + (lx - 0.55));
          var dl = 0.24 + 0.2 * light + 0.4 * d3 * d3 * 0 + 0.55 * sm(0.82, 1, dd) * (0.55 + 0.45 * light);
          var dh = 0.45 + 0.25 * light;
          var rimE = sm(0.9, 1, dd);
          dl += 0.2 * sm(0.55, 0.9, dd) * light;
          /* spots */
          for (var s = 0; s < SPOTS.length; s++) {
            var sp = SPOTS[s], ddx = xs - sp[0], ddy = (y - sp[1]) * 1.25;
            var sd = Math.sqrt(ddx * ddx + ddy * ddy);
            if (sd < sp[2]) { var a = sm(sp[2], sp[2] * 0.7, sd); dl += a * (0.5 - dl) * 1 + a * 0.3; dh += (0.95 - dh) * a; }
          }
          lum = dl; hint = dh; edge = rimE; mask = 1;
        }
        b.lum[i] = Math.min(1, Math.max(0, lum)); b.hint[i] = Math.min(1, Math.max(0, hint));
        b.edge[i] = edge; b.mask[i] = mask;
      }
    }
  }

  function buildAtlas() {
    var s = 32, c = document.createElement('canvas'); c.width = c.height = s;
    var g = c.getContext('2d', { willReadFrequently: true }), set = ' .:+x*o%#', out = [];
    for (var i = 0; i < set.length; i++) {
      g.clearRect(0, 0, s, s); g.fillStyle = '#fff'; g.font = '700 ' + s + 'px ' + FONT;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      if (set[i] !== ' ') g.fillText(set[i], s / 2, s / 2 + s * 0.04);
      var d = g.getImageData(0, 0, s, s).data, a = 0;
      for (var k = 3; k < d.length; k += 4) a += d[k];
      out.push({ ch: set[i], cov: a / 255 / (s * s) });
    }
    out.sort(function (p, q) { return p.cov - q.cov; });
    var mx = out[out.length - 1].cov;
    for (var j = 0; j < out.length; j++) out[j].cov /= mx * 1.02;
    out.push({ ch: '#', cov: 1, block: true });
    GL = out;
  }
  function pick(f) {
    var best = 0, bd = 9;
    for (var i = 0; i < GL.length; i++) { var d = Math.abs(GL[i].cov - f); if (d < bd) { bd = d; best = i; } }
    return GL[best];
  }
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    unit = Math.max(9, Math.ceil(Math.max(W, H) / 120));
    cols = Math.ceil(W / unit); rows = Math.ceil(H / unit);
    buf = S.create(cols, rows, 1);
  }
  var BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

  function frame(tm) {
    var t = still ? 6 : tm / 1000 * 0.4;
    sign(buf, t);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.fillStyle = LADDER[0]; cx.fillRect(0, 0, W, H);
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    var fs = unit * 1.05, sx = unit / (fs * 0.6);
    cx.font = '700 ' + fs + 'px ' + FONT;
    var n = LADDER.length - 1, cand = [], liveIdx = -1;
    for (var q = 0; q < cols * rows; q += 3) if (buf.edge[q] > 0.75 && buf.lum[q] > 0.5) cand.push(q);
    if (cand.length) liveIdx = cand[Math.floor(t * 0.5) % cand.length];

    for (var y = 0; y < rows; y++) {
      for (var x = 0; x < cols; x++) {
        var i = y * cols + x, L = buf.lum[i], hint = buf.hint[i];
        var tone = Math.min(1, L * 1.08);
        var s = Math.pow(tone, 1.45) * (0.64 + 0.46 * hint);
        s = Math.min(1, Math.max(0, s));
        if (L < 0.16) s *= Math.pow(L / 0.16, 2);        /* the ground sinks to plain harbor */
        var p = s * n, k = Math.min(n - 1, Math.floor(p)), f = p - k;
        f += ((BAY[(y & 3) * 4 + (x & 3)] + 0.5) / 16 - 0.5) * 0.1;
        f = Math.min(1, Math.max(0, f));
        var px = x * unit, py = y * unit;
        if (k > 0 || f > 0.02) { cx.fillStyle = LADDER[k]; if (k > 0) cx.fillRect(px, py, unit + 0.5, unit + 0.5); }
        if (i === liveIdx) {
          cx.fillStyle = LADDER[0]; cx.fillRect(px, py, unit + .5, unit + .5);
          cx.fillStyle = mintC; cx.fillText('*', px + unit / 2, py + unit / 2); continue;
        }
        if (f < 0.06) continue;
        var g = pick(f);
        if (g.ch === ' ') continue;
        cx.fillStyle = LADDER[k + 1];
        if (g.block) { cx.fillRect(px, py, unit + 0.5, unit + 0.5); continue; }
        cx.save(); cx.translate(px + unit / 2, py + unit / 2 + unit * 0.04); cx.scale(sx, 1);
        cx.fillText(g.ch, 0, 0); cx.restore();
      }
    }
  }
  var last = 0;
  function loop(tm) { if (tm - last > 66) { last = tm; frame(tm); } requestAnimationFrame(loop); }
  buildAtlas(); resize();
  window.addEventListener('resize', function () { resize(); frame(performance.now()); });
  if (still) frame(0); else requestAnimationFrame(loop);
})();
</script>
</body>
</html>
