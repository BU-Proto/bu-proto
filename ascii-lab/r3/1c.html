<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Proto mushroom sign, cells</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #061a2e; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../kit/palette.js"></script>
<script>
(function () {
  'use strict';
  var Pal = LabPalette;
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv = document.getElementById('c'), cx = cv.getContext('2d');
  var inks = (function () { var o = [], i, t, c; for (i = 0; i < 128; i++) { t = i / 127;
    c = t < 0.22 ? Pal.mix('iris deep', 'raspberry', t / 0.22) : t < 0.66 ? Pal.mix('raspberry', 'rose', (t - 0.22) / 0.44) : Pal.mix('rose', 'peach', (t - 0.66) / 0.34);
    o.push(Pal.toCss(c)); } return o; })();
  var HARBOR = '#061a2e', FROST = '#f6fbff', RAISEDHI = '#123a5c', ROSE = '#f4a2c0', RASP = '#c2407a', IRISD = '#7a6ee0', MINT = '#9df0a8';
  var W, H, CW, CH, cols, rows, dpr, S, OX, OY, field, word;

  function hash(i, j) { var s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); }
  function sm(a, b, x) { x = Math.max(0, Math.min(1, (x - a) / (b - a))); return x * x * (3 - 2 * x); }
  function ell(x, y, cxx, cyy, rx, ry) { var f = Math.sqrt(((x - cxx) / rx) * ((x - cxx) / rx) + ((y - cyy) / ry) * ((y - cyy) / ry)); return (f - 1) * Math.min(rx, ry); }

  /* sign geometry in unit coords, x -0.5..0.5, y -0.5..0.5 (y down). returns signed distance (neg inside) */
  function sdf(x, y) {
    var d = 1e9, a;
    /* cap dome: upper half of ellipse, with a gently curved underside lip */
    if (y <= -0.02) d = ell(x, y, 0, -0.02, 0.5, 0.40);
    else {
      var lip = ell(x, y, 0, -0.02, 0.5, 0.40);
      var under = (y - (0.02 + 0.05 * (1 - Math.min(1, Math.abs(x) / 0.5) * Math.min(1, Math.abs(x) / 0.5)) * 0 + 0.16 * (x * x) / 0.25)) ;
      d = Math.max(lip, under);
    }
    /* stem: tapered, flared foot */
    var half = 0.115 + 0.03 * sm(0.15, 0.5, y) + 0.09 * sm(0.38, 0.5, y);
    var stem = Math.max(Math.abs(x) - half, Math.max(0.0 - y, y - 0.5));
    d = Math.min(d, stem);
    return d;
  }

  function setup() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    CW = Math.max(8, Math.round(W / 110)); CH = Math.max(4, Math.round(CW * 0.5));
    cols = Math.ceil(W / CW) + 1; rows = Math.ceil(H / CH) + 1;
    S = Math.min(W * 0.62, H * 0.66);
    OX = W / 2; OY = H * 0.44;
    /* wordmark mask */
    var o = document.createElement('canvas'); o.width = cols; o.height = rows; var oc = o.getContext('2d');
    oc.fillStyle = '#000'; oc.fillRect(0, 0, cols, rows);
    var fs = Math.max(6, Math.round(S * 0.11 / CH));
    oc.fillStyle = '#fff'; oc.font = '700 ' + fs + 'px ui-monospace, Menlo, monospace'; oc.textAlign = 'center'; oc.textBaseline = 'middle';
    var ty = (OY + S * 0.5 + S * 0.12) / CH;
    oc.fillText('P R O T O', cols / 2, ty);
    var id = oc.getImageData(0, 0, cols, rows).data; word = new Float32Array(cols * rows);
    for (var i = 0; i < word.length; i++) word[i] = id[i * 4] / 255;
  }

  function draw(t) {
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.fillStyle = HARBOR; cx.fillRect(0, 0, W, H);
    var r, c, LX = -0.55, LY = -0.7;
    for (r = 0; r < rows; r++) {
      var y0 = r * CH;
      for (c = 0; c < cols; c++) {
        var x0 = c * CW, i = r * cols + c;
        var px = ((x0 + CW / 2) - OX) / S, py = ((y0 + CH / 2) - OY) / S;
        var hh = hash(c, r), hv = hash(r + 91, c + 17);
        var drift = 0.5 + 0.5 * Math.sin(c * 0.31 + r * 0.17 + t * 0.5) * Math.cos(r * 0.23 - t * 0.3);
        var d = sdf(px, py);
        if (false) {
          cx.fillStyle = hh > 0.12 ? ROSE : FROST; cx.fillRect(x0 + 1, y0, CW - 2, CH - 1); continue;
        }
        if (d < 0.012) {
          /* inside the sign */
          var depth = -d;
          var under = py > 0.0 && Math.abs(px) > 0.13 && py < 0.02 + 0.16 * (px * px) / 0.25 + 0.012;
          /* lighting: dome shading from upper left, stem shaded on right */
          var nx = px / 0.5, ny = (py + 0.02) / 0.4;
          var lum = 0.5 + 0.38 * (-(nx * LX + ny * LY) / 1.1) + 0.12 * Math.sin(px * 9 + 1.0);
          if (py > 0.02 && Math.abs(px) < 0.2) lum = 0.62 - 0.55 * sm(-0.1, 0.12, px) + 0.1 * sm(0.0, 0.3, -px) ;
          lum += 0.05 * (drift - 0.5);
          lum = Math.max(0.05, Math.min(1, lum));
          var edgeFade = sm(0, 0.02, depth);
          var tint = inks[Math.min(127, Math.floor(Math.max(0, Math.min(1, 0.1 + 0.85 * lum)) * 127))];
          /* dissolve at boundary and at the right lee side */
          var lee = sm(0.0, 0.5, px) * 0.35 + 0.1;
          if (edgeFade < 1 && hh > 0.2 + 0.8 * edgeFade) { 
            if (hv < 0.5) { cx.fillStyle = hv < 0.2 ? RASP : ROSE; cx.fillRect(x0 + CW * 0.2, y0 + CH * 0.4, CW * 0.6, Math.max(1, CH * 0.2)); }
            continue;
          }
          if (under) {
            /* gills: vertical slats radiating, harbor gaps */
            var gi = Math.floor(px * 40 + 0.5);
            cx.fillStyle = (gi & 1) ? RASP : IRISD;
            if (hh > 0.8) cx.fillStyle = ROSE;
            cx.fillRect(x0 + CW * 0.2, y0, CW * 0.6, CH - 1);
            continue;
          }
          cx.fillStyle = tint;
          cx.fillRect(x0 + (hh > 0.9 ? 1 : 0), y0, CW - 1, CH - 1);
          /* spots: peach/frost discs */
          var sp = [[-0.22, -0.2, 0.075], [0.12, -0.28, 0.06], [0.28, -0.1, 0.045], [-0.04, -0.12, 0.04]];
          for (var k = 0; k < sp.length; k++) {
            var dd = Math.hypot(px - sp[k][0], (py - sp[k][1]) * 1.0) - sp[k][2];
            if (dd < 0) { cx.fillStyle = dd < -sp[k][2] * 0.45 ? FROST : '#f8928a'; cx.fillRect(x0, y0, CW - 1, CH - 1); }
          }
          /* rim bar highlight, upper-left edge of cap */
          if (py < 0 && depth < 0.05 && px < 0.1 && hh < 0.8) { cx.fillStyle = FROST; cx.fillRect(x0 + CW * 0.05, y0 + CH * 0.35, CW * 0.9, Math.max(1, CH * 0.3)); }
          if (depth > 0.04 && lum < 0.35 && hh < 0.5) { cx.fillStyle = HARBOR; cx.fillRect(x0 + CW * 0.15, y0 + CH * 0.4, CW * 0.7, Math.max(1, CH * 0.16)); }
        } else if (d < 0.4) {
          /* outside: dissolving dashes, drifting right */
          var k2 = 1 - sm(0.0, 0.4, d);
          var wind = (px > 0 ? 1.3 : 0.7);
          var keep = k2 * k2 * k2 * 0.8 * wind + (drift - 0.5) * 0.15;
          if (hh < keep) {
            var th = Math.max(1, CH * (0.12 + 0.5 * k2)), wd = CW * (0.4 + 0.6 * k2);
            var sh = (1 - k2) * CW * 2 * (hv - 0.5) + (1 - k2) * 5 * Math.sin(t * 0.6 + r * 0.7);
            cx.globalAlpha = 0.35 + 0.65 * k2;
            cx.fillStyle = hv > 0.82 ? ROSE : hv > 0.55 ? inks[40 + Math.floor(k2 * 60)] : RASP;
            cx.fillRect(x0 + (CW - wd) / 2 + sh, y0 + (CH - th) / 2, wd, th);
            cx.globalAlpha = 1;
          }
        } else if (hh > 0.992) { cx.fillStyle = hh > 0.996 ? ROSE : RAISEDHI; cx.fillRect(x0 + CW * 0.25, y0 + CH * 0.45, CW * 0.5, 1); }
      }
    }
    /* live mint tick at the cap's top */
    if (Math.floor(t * 1.6) % 2 === 0) { cx.fillStyle = MINT; cx.fillRect(OX - CW, OY - S * 0.42 - CH * 3, CW * 2, CH); }
  }

  setup();
  addEventListener('resize', function () { setup(); draw(6); });
  if (still) { draw(6); return; }
  (function loop(ms) { draw((ms || 0) / 1000 + 6); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
