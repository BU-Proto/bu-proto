<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Proto hero, dissolving mushroom</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #061a2e; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .scrim { position: fixed; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(6,26,46,.93) 0%, rgba(6,26,46,.82) 34%, rgba(6,26,46,.35) 58%, rgba(6,26,46,0) 78%),
                linear-gradient(0deg, rgba(6,26,46,.7) 0%, rgba(6,26,46,0) 35%); }
  .hero { position: fixed; left: clamp(20px, 6vw, 96px); bottom: clamp(32px, 11vh, 120px); max-width: min(46rem, 88vw);
    font: 600 clamp(32px, 5.2vw, 76px)/1.04 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: -0.02em; color: #f6fbff; }
  .hero h1 { margin: 0 0 clamp(20px, 3.4vh, 36px); font: inherit; text-shadow: 0 2px 24px #061a2e, 0 0 3px #061a2e; }
  .join { display: inline-block; font: 700 clamp(15px, 1.5vw, 19px)/1 ui-monospace, Menlo, monospace; padding: 16px 30px; border-radius: 999px;
    background: #9df0a8; color: #061a2e; text-decoration: none; box-shadow: 0 0 0 0 rgba(157,240,168,.5); transition: transform .15s, box-shadow .2s; }
  .join:hover, .join:focus-visible { transform: translateY(-2px); box-shadow: 0 0 0 6px rgba(157,240,168,.25); outline: none; }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="scrim"></div>
<main class="hero"><h1>Proto is the home base for building things at BU</h1><a class="join" href="#join">Join</a></main>
<script src="../kit/palette.js"></script>
<script src="../kit/subjects.js"></script>
<script>
(function () {
  'use strict';
  var S = LabSubjects, Pal = LabPalette;
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv = document.getElementById('c'), cx = cv.getContext('2d');
  var inks = (function(){ var o=[],i,t,c; for(i=0;i<128;i++){ t=i/127;
    /* pink-led ramp: iris deep -> raspberry -> rose -> peach; blues only as a faint low end */
    c = t<0.18 ? Pal.mix('iris deep','raspberry',t/0.18) : t<0.62 ? Pal.mix('raspberry','rose',(t-0.18)/0.44) : Pal.mix('rose','peach',(t-0.62)/0.38);
    o.push(Pal.toCss(c)); } return o; })(), HARBOR = '#061a2e', FROST = '#f6fbff', RAISED = '#0b2a46', RAISEDHI = '#123a5c';
  var ROSE = '#f4a2c0';
  var IRISD = '#7a6ee0', CER = '#1a8fc0', LAG = '#3fb8d0', RASP = '#c2407a';
  var W, H, CW, CH, cols, rows, buf, dpr;

  function hash(i, j) { var s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); }

  function setup() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    CW = Math.max(10, Math.round(W / 84)); CH = Math.max(5, Math.round(CW * 0.5));
    cols = Math.ceil(W / CW) + 1; rows = Math.ceil(H / CH) + 1;
    buf = S.create(cols, rows, CW / CH);
  }

  function draw(t) {
    var B = buf, i, r, c;
    S.fill('mushroom', B, t);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.fillStyle = HARBOR; cx.fillRect(0, 0, W, H);
    for (r = 0; r < rows; r++) {
      var y0 = r * CH;
      for (c = 0; c < cols; c++) {
        i = r * cols + c;
        var l = B.lum[i], h = B.hint[i], m = B.mask[i], e = B.edge[i];
        /* mass: how much cell is "there". subject is dense, background thin */
        var mass = Math.max(0, Math.min(1, (l - 0.1) * 1.55 + m * 0.15)); if (m < 0.5) mass *= 0.6 + 0.4 * m;
        var drift = S.noise(c * 0.22 + t * 0.07, r * 0.4 - t * 0.05);
        var hh = hash(c, r), hv = hash(r + 91, c + 17);
        var x0 = c * CW;
        var tint = inks[Math.min(127, Math.floor(Math.max(0, Math.min(1, 0.14 + 0.78 * h + 0.06 * (drift - 0.5))) * 127))];
        if (mass > 0.62) {
          /* body: stretched rectangles tiling, narrowing as mass thins */
          var gap = 1 + (0.8 - mass) * 3;
          var ww = CW - (mass > 0.8 ? 1 : 1 + (0.8 - mass) * CW * 0.8);
          var xo = (CW - ww) * hh;
          if (l > 0.86) cx.fillStyle = FROST;
          else cx.fillStyle = tint;
          cx.fillRect(x0 + xo, y0, ww, CH - (gap > 2 ? 2 : 1));
          /* shadow polarity: harbor slit cut into deep body cells */
          if (l < 0.42 && m > 0.5 && e < 0.5 && hh < 0.7) {
            cx.fillStyle = HARBOR; cx.fillRect(x0 + CW * 0.15, y0 + CH * 0.38, CW * 0.7, Math.max(1, CH * 0.16));
          }
          /* edge lines in the bright pass: rim bar, frost */
          if (e > 0.55 && l > 0.5 && hv < e) {
            cx.fillStyle = l > 0.7 ? FROST : ROSE;
            cx.fillRect(x0 + CW * 0.1, y0 + CH * 0.4, CW * 0.8, Math.max(1, CH * 0.2));
          }
        } else if (mass > 0.07) {
          /* dissolve: cells keep their width, shed height, then drop out and slide */
          var k = mass / 0.62;
          var keep = k * 1.7 + (drift - 0.5) * 0.9;
          if (hh > keep) {
            /* ghost: a faint raised dash where a cell used to be */
            if (hv < 0.35 * k + 0.05) { cx.fillStyle = hv < 0.2 ? RASP : RAISEDHI; cx.fillRect(x0 + CW * 0.1, y0 + CH * 0.42, CW * 0.8, 1); }
            continue;
          }
          var th = Math.max(1, CH * (0.14 + 0.7 * k * k));
          var wd = CW * (0.35 + 0.65 * Math.min(1, k * 1.3));
          var sh = (1 - k) * CW * 1.9 * (hv - 0.5) * 2 + (1 - k) * 6 * Math.sin(t * 0.6 + r * 0.7);
          var dx = x0 + (CW - wd) / 2 + sh, dy = y0 + (CH - th) / 2;
          cx.fillStyle = tint; cx.globalAlpha = 0.45 + 0.55 * Math.min(1, k * 1.4);
          if (k < 0.5 && hv > 0.8) cx.fillStyle = (hv > 0.9 ? ROSE : RASP);
          cx.fillRect(dx, dy, wd, th);
          cx.globalAlpha = 1;
        } else if (hh > 0.985) {
          /* far spores: single dashes in sky */
          cx.fillStyle = hh > 0.993 ? ROSE : RAISEDHI; cx.fillRect(x0 + CW * 0.25, y0 + CH * 0.45, CW * 0.5, 1);
        }
      }
    }
  }

  setup();
  addEventListener('resize', function () { setup(); draw(6); });
  if (still) { draw(6); return; }
  (function loop(ms) { draw((ms || 0) / 1000 + 6); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
