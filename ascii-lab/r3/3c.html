<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r3/3c Mushroom sign</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #061a2e; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../kit/palette.js"></script>
<script>
/* No font, no atlas. Every glyph is built in the fragment shader from line segments, and the glyph is a
   continuous function of two fields: tone picks how many strokes it owns (dot, dash, line, cross, asterisk,
   diamond, solid bar) and the contour direction of a warped height field sets the angle of every stroke.
   Neighbouring cells therefore hatch along the contours of the field like an engraving made of marks.
   Hue is a third, separate field read from a baked pink-weighted arc. Shadows get dim ticks, midtones the
   arc, peaks blow out to frost bars with a peach core. One mint cell wanders as the live cursor. */
(function () {
  'use strict';
  var P = LabPalette;
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv = document.getElementById('c');
  var gl = cv.getContext('webgl2', { antialias: false, alpha: false });

  var VS = '#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  var FS = [
'#version 300 es',
'precision highp float;',
'uniform vec2 R; uniform float T; uniform vec2 cell; uniform sampler2D lut;',
'out vec4 o;',
'const vec3 HARBOR=vec3(.0235,.1020,.1804), RAISED=vec3(.0431,.1647,.2745), RHI=vec3(.0706,.2275,.3608);',
'const vec3 FROST=vec3(.9647,.9843,1.), PEACH=vec3(.9725,.5725,.5412), MINT=vec3(.6157,.9412,.6588);',
'const float PI=3.14159265;',
'float hgt(vec2 q,float t){',
'  q+=.30*vec2(sin(q.y*2.1+t*.16+1.3),cos(q.x*1.7-t*.13));',
'  float a=sin(q.x*2.4+1.6*sin(q.y*1.8+t*.1)+t*.15);',
'  float c=sin(length(q-vec2(.25,-.1))*4.6-t*.28);',
'  return .5+.5*(.6*a+.4*c);',
'}',
/* the mushroom as a depth field: x in u, y up. returns z (0 = off), kind in k: 1 dome, 2 gills, 3 stem, 4 spot */
'float shroom(vec2 u,float t,out float k){',
'  k=0.; u.y+=.05;',
'  u.x-=.03*sin(t*.3)*smoothstep(.2,-.8,u.y)*(.6+.4*sin(t*.2));',
'  vec2 p=u-vec2(0.,.14);',
'  float s=(p.x*p.x)/.67+(p.y*p.y)/.40;',
'  float z=0.;',
'  float w=.19+.08*smoothstep(-.12,-.74,u.y)+.03*exp(-pow((u.y+.34)*14.,2.));',
'  if(u.y>-.78&&u.y<.0&&abs(u.x)<w){ z=.8*sqrt(1.-(u.x*u.x)/(w*w)); k=3.; }',
'  float lw=.80*(1.+p.y*.9);',
'  if(p.y<=.0&&p.y>-.13&&abs(p.x)<lw){ z=.14; k=2.; }',
'  if(p.y>-.02&&s<1.){ z=sqrt(1.-s); k=1.;',
'    vec2 sp[4]=vec2[4](vec2(-.34,.30),vec2(.18,.40),vec2(.47,.16),vec2(-.58,.12));',
'    float sr[4]=float[4](.095,.075,.085,.06);',
'    for(int i=0;i<4;i++){ vec2 d=(p-sp[i])*vec2(1.,1.25); if(length(d)<sr[i]) k=4.; }',
'  }',
'  return z;',
'}',
'float seg(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h);}',
'vec2 rot(vec2 p,float a){float c=cos(a),s=sin(a);return vec2(c*p.x+s*p.y,-s*p.x+c*p.y);}',
'float line(vec2 p,float a,float hl){vec2 d=vec2(cos(a),sin(a))*hl;return seg(p,-d,d);}',
/* four marks and a bar: dot, dash, line, cross, bar */
'float glyph(vec2 p,float lv,float a){',
'  if(lv<1.5) return length(p)-.02;',
'  if(lv<2.5) return line(p,a,.14);',
'  if(lv<3.5) return line(p,a,.40);',
'  if(lv<4.5) return min(line(p,a,.40),line(p,a+PI*.5,.22));',
'  vec2 r=abs(rot(p,a))-vec2(.40,.15); return length(max(r,0.))+min(max(r.x,r.y),0.)+.03;',
'}',
'vec3 ramp(float t){return texture(lut,vec2(clamp(t,0.,1.)*.998+.001,.5)).rgb;}',
'void main(){',
'  vec2 px=gl_FragCoord.xy; px.y=R.y-px.y;',
'  vec2 id=floor(px/cell); vec2 f=(px-id*cell)/cell-.5;',
'  vec2 cc=(id+.5)*cell;',
'  float asp=R.x/R.y;',
'  vec2 q=(cc/R.y-vec2(asp*.5,.5))*2.;',
'  float t=T,e=.012;',
'  vec2 u=vec2(q.x,-q.y)*.92;',
'  float k,k2;',
'  float z=shroom(u,t,k);',
'  float zx=shroom(u+vec2(e,0.),t,k2)-shroom(u-vec2(e,0.),t,k2);',
'  float zy=shroom(u+vec2(0.,e),t,k2)-shroom(u-vec2(0.,e),t,k2);',
'  float hb=hgt(q,t);',
'  float ca=cell.y/cell.x;',
'  vec2 p=f*vec2(1./ca,1.);',
'  float vig=smoothstep(2.2,.2,length(q*vec2(.7,1.)));',
'  float tone,hu,ang;',
'  if(z>.001){',
'    vec3 n=normalize(vec3(-zx/(2.*e),-zy/(2.*e),1.));',
'    vec3 L=normalize(vec3(-.5+.2*sin(t*.2),.6,.7));',
'    float df=clamp(dot(n,L),0.,1.);',
'    ang=atan(zy,zx)+PI*.5;',
'    if(k>1.5&&k<2.5){ tone=.56; hu=.36; ang=PI*.5; }',
'    else if(k>2.5&&k<3.5){',
'      float occ=smoothstep(-.02,-.34,u.y);',
'      tone=(.38+.5*df)*(.45+.55*occ)+.1*smoothstep(.4,.0,z); hu=.12+.26*df+.1*(1.-occ);',
'    } else {',
'      tone=.4+.6*pow(df,1.1); hu=.5+.34*df;',
'      if(k>3.5){ tone=.99; hu=.9; }',
'      tone+=.16*smoothstep(.3,.0,z);',
'    }',
'    tone=clamp(tone,0.,1.);',
'  } else {',
'    tone=.1+.26*smoothstep(.55,.95,hb)*(.4+.6*vig); hu=.08+.3*hb; ang=atan(zy,zx)+PI*.5;',
'    float gx=hgt(q+vec2(e,0.),t)-hgt(q-vec2(e,0.),t), gy=hgt(q+vec2(0.,e),t)-hgt(q-vec2(0.,e),t);',
'    ang=atan(gy,gx)+PI*.5; k=0.;',
'  }',
'  vec3 col=ramp(clamp(hu,0.,1.));',
'  float lv=clamp(floor(tone*5.6-.3),0.,5.);',
'  float pxu=1./cell.y;',
'  float d=lv>.5?glyph(p,lv,ang):1e3;',
'  float cov=1.-smoothstep(.04-pxu*.8,.04+pxu*.8,d);',
'  vec3 gnd=mix(HARBOR,RAISED,smoothstep(1.5,.0,length(q))*.8);',
'  vec3 ink=col;',
'  if(k<.5) ink=mix(col,gnd,.6);',
'  if(tone>.8) ink=mix(col,PEACH,smoothstep(.85,.95,tone)*.5); if(tone>.95) ink=mix(ink,FROST,smoothstep(.95,.995,tone));',
'  vec3 c=mix(gnd,ink,cov);',
'  vec2 mc=floor((vec2(.5+.36*sin(t*.23),.5+.33*sin(t*.31+1.))*R)/cell);',
'  if(id==mc||id==mc+vec2(1.,0.)){',
'    float dm=min(line(p,0.,.4),line(p,PI*.5,.28));',
'    c=mix(c,MINT,(1.-smoothstep(.04-pxu,.04+pxu,dm))*(.6+.4*step(.5,fract(t*1.4))));',
'  }',
'  o=vec4(c,1.);',
'}'].join('\n');

function sh(type, src) {
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  var pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(pr); gl.useProgram(pr);
  var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 256, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, P.lut(256));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  var uR = gl.getUniformLocation(pr, 'R'), uT = gl.getUniformLocation(pr, 'T'), uC = gl.getUniformLocation(pr, 'cell');
  gl.uniform1i(gl.getUniformLocation(pr, 'lut'), 0);

  function size() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
    var cw = Math.max(10, Math.round(innerWidth / 100)) * dpr;
    gl.viewport(0, 0, cv.width, cv.height);
    gl.uniform2f(uR, cv.width, cv.height);
    gl.uniform2f(uC, cw, Math.round(cw * 1.8));
  }
  function draw(t) { gl.uniform1f(uT, t); gl.drawArrays(gl.TRIANGLES, 0, 3); }
  var T0 = 6;
  size(); draw(T0);
  addEventListener('resize', function () { size(); draw(T0); });
  if (!still) (function loop(ms) { draw(T0 + ms / 1000); requestAnimationFrame(loop); })(0);
})();
</script>
</body>
</html>
