<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mushroom, luminous depth</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #061a2e; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../kit/palette.js"></script>
<script src="../kit/subjects.js"></script>
<script>
(function () {
  'use strict';
  var S = LabSubjects, Pal = LabPalette;
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv = document.getElementById('c'), mx = cv.getContext('2d'), cx = mx;
  var off = document.createElement('canvas'), ox = off.getContext('2d'), sm = document.createElement('canvas'), sx = sm.getContext('2d');
  var inks = Pal.cssLut(128), HARBOR = '#061a2e', FROST = '#f6fbff', RAISED = '#0b2a46', RAISEDHI = '#123a5c';
  var IRISD = '#7a6ee0', CER = '#1a8fc0', LAG = '#3fb8d0', RASP = '#c2407a';
  var W, H, CW, CH, cols, rows, buf, dpr;

  function hash(i, j) { var s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); }

  function setup() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    CW = Math.max(10, Math.round(W / 84)); CH = Math.max(5, Math.round(CW * 0.5));
    cols = Math.ceil(W / CW) + 1; rows = Math.ceil(H / CH) + 1;
    buf = S.create(cols, rows, CW / CH);
    off.width = cv.width; off.height = cv.height; sm.width = Math.max(8, cv.width >> 3); sm.height = Math.max(8, cv.height >> 3);
  }

  function draw(t) {
    var B = buf, i, r, c;
    S.fill('mushroom', B, t);
    cx = ox; ox.setTransform(dpr, 0, 0, dpr, 0, 0); ox.clearRect(0, 0, W, H);
    for (r = 0; r < rows; r++) {
      var y0 = r * CH;
      for (c = 0; c < cols; c++) {
        i = r * cols + c;
        var l = B.lum[i], h = B.hint[i], m = B.mask[i], e = B.edge[i];
        /* mass: how much cell is "there". subject is dense, background thin */
        var mass = Math.max(0, Math.min(1, (l - 0.1) * 1.55 + m * 0.15)); if (m < 0.5) mass *= 0.6 + 0.4 * m;
        var drift = S.noise(c * 0.22 + t * 0.07, r * 0.4 - t * 0.05);
        var hh = hash(c, r), hv = hash(r + 91, c + 17);
        var x0 = c * CW;
        var tint = inks[Math.min(127, Math.floor(Math.max(0, Math.min(1, 0.1 + 0.66 * h + 0.06 * (drift - 0.5))) * 127))];
        if (mass > 0.62) {
          /* body: stretched rectangles tiling, narrowing as mass thins */
          var gap = 1 + (0.8 - mass) * 3;
          var ww = CW - (mass > 0.8 ? 1 : 1 + (0.8 - mass) * CW * 0.8);
          var xo = (CW - ww) * hh;
          if (l > 0.86) cx.fillStyle = FROST;
          else cx.fillStyle = tint;
          cx.fillRect(x0 + xo, y0, ww, CH - (gap > 2 ? 2 : 1));
          /* shadow polarity: harbor slit cut into deep body cells */
          if (l < 0.42 && m > 0.5 && e < 0.5 && hh < 0.7) {
            cx.fillStyle = HARBOR; cx.fillRect(x0 + CW * 0.15, y0 + CH * 0.38, CW * 0.7, Math.max(1, CH * 0.16));
          }
          /* edge lines in the bright pass: rim bar, frost */
          if (e > 0.55 && l > 0.5 && hv < e) {
            cx.fillStyle = l > 0.7 ? FROST : LAG;
            cx.fillRect(x0 + CW * 0.1, y0 + CH * 0.4, CW * 0.8, Math.max(1, CH * 0.2));
          }
        } else if (mass > 0.07) {
          /* dissolve: cells keep their width, shed height, then drop out and slide */
          var k = mass / 0.62;
          var keep = k * 1.7 + (drift - 0.5) * 0.9;
          if (hh > keep) {
            /* ghost: a faint raised dash where a cell used to be */
            if (hv < 0.35 * k + 0.05) { cx.fillStyle = RAISEDHI; cx.fillRect(x0 + CW * 0.1, y0 + CH * 0.42, CW * 0.8, 1); }
            continue;
          }
          var th = Math.max(1, CH * (0.14 + 0.7 * k * k));
          var wd = CW * (0.35 + 0.65 * Math.min(1, k * 1.3));
          var sh = (1 - k) * CW * 1.9 * (hv - 0.5) * 2 + (1 - k) * 6 * Math.sin(t * 0.6 + r * 0.7);
          var dx = x0 + (CW - wd) / 2 + sh, dy = y0 + (CH - th) / 2;
          cx.fillStyle = tint; cx.globalAlpha = 0.45 + 0.55 * Math.min(1, k * 1.4);
          if (k < 0.5 && hv > 0.8) cx.fillStyle = Pal.toCss(Pal.arc(0.7 + 0.2 * hv));
          cx.fillRect(dx, dy, wd, th);
          cx.globalAlpha = 1;
        } else if (hh > 0.985) {
          /* far spores: single dashes in sky */
          cx.fillStyle = RAISEDHI; cx.fillRect(x0 + CW * 0.25, y0 + CH * 0.45, CW * 0.5, 1);
        }
      }
    }
    composite(t);
  }

  function composite(t) {
    var g, k, px = W * 0.5, py = H * 0.46, R = Math.max(W, H);
    mx.setTransform(dpr, 0, 0, dpr, 0, 0); mx.globalAlpha = 1; mx.globalCompositeOperation = 'source-over';
    mx.fillStyle = HARBOR; mx.fillRect(0, 0, W, H);
    /* atmosphere: far haze, deep iris pool behind the object, rose breath below */
    g = mx.createRadialGradient(px, py, 0, px, py, R * 0.62);
    g.addColorStop(0, 'rgba(122,110,224,0.30)'); g.addColorStop(0.45, 'rgba(18,58,92,0.45)'); g.addColorStop(1, 'rgba(6,26,46,0)');
    mx.fillStyle = g; mx.fillRect(0, 0, W, H);
    g = mx.createRadialGradient(px, H * 0.9, 0, px, H * 0.9, R * 0.5);
    g.addColorStop(0, 'rgba(194,64,122,0.26)'); g.addColorStop(1, 'rgba(194,64,122,0)');
    mx.fillStyle = g; mx.fillRect(0, 0, W, H);
    /* light shafts from the cap, slow */
    mx.globalCompositeOperation = 'lighter';
    for (k = 0; k < 7; k++) {
      var a = -Math.PI / 2 + (k - 3) * 0.2 + 0.05 * Math.sin(t * 0.2 + k * 1.7), wdt = 0.05 + 0.03 * Math.sin(t * 0.3 + k);
      g = mx.createRadialGradient(px, py, 0, px, py, R * 0.9);
      g.addColorStop(0, 'rgba(244,162,192,0.10)'); g.addColorStop(1, 'rgba(244,162,192,0)');
      mx.fillStyle = g; mx.beginPath(); mx.moveTo(px, py);
      mx.lineTo(px + Math.cos(a - wdt) * R, py + Math.sin(a - wdt) * R);
      mx.lineTo(px + Math.cos(a + wdt) * R, py + Math.sin(a + wdt) * R); mx.closePath(); mx.fill();
    }
    /* far plate: soft blurred copy, scaled and offset, reads as distant mist of the same cells */
    mx.globalAlpha = 0.16; mx.save(); mx.translate(px, py); mx.scale(1.18, 1.18); mx.translate(-px, -py * 0.97);
    mx.drawImage(off, 0, 0, W, H); mx.restore();
    /* bloom: emission of the object, two radii */
    sx.setTransform(1, 0, 0, 1, 0, 0); sx.clearRect(0, 0, sm.width, sm.height); sx.drawImage(off, 0, 0, sm.width, sm.height);
    mx.globalAlpha = 0.85; mx.drawImage(sm, 0, 0, W, H);
    mx.globalAlpha = 0.5; mx.drawImage(sm, -W * 0.03, -H * 0.03, W * 1.06, H * 1.06);
    /* the object itself, sharp */
    mx.globalCompositeOperation = 'source-over'; mx.globalAlpha = 1; mx.drawImage(off, 0, 0, W, H);
    /* warm core: peach into frost at the cap's hot point */
    mx.globalCompositeOperation = 'lighter';
    g = mx.createRadialGradient(px, py * 0.85, 0, px, py * 0.85, R * 0.16);
    g.addColorStop(0, 'rgba(248,146,138,0.22)'); g.addColorStop(1, 'rgba(248,146,138,0)');
    mx.fillStyle = g; mx.fillRect(0, 0, W, H);
    /* near spores: large, soft, out of focus, drifting past the lens */
    for (k = 0; k < 26; k++) {
      var sxp = (hash(k, 3) * W + t * (6 + 10 * hash(k, 8)) * (k % 2 ? 1 : -1) + W * 4) % W, syp = (hash(k, 5) * H - t * (4 + 8 * hash(k, 9)) + H * 8) % H;
      var rr = 3 + hash(k, 7) * 10; g = mx.createRadialGradient(sxp, syp, 0, sxp, syp, rr);
      g.addColorStop(0, k % 3 ? 'rgba(244,162,192,0.20)' : 'rgba(124,199,244,0.20)'); g.addColorStop(1, 'rgba(244,162,192,0)');
      mx.fillStyle = g; mx.fillRect(sxp - rr, syp - rr, rr * 2, rr * 2);
    }
    /* depth fog and vignette: harbor closes in at edges and floor */
    mx.globalCompositeOperation = 'source-over';
    g = mx.createLinearGradient(0, H * 0.7, 0, H);
    g.addColorStop(0, 'rgba(6,26,46,0)'); g.addColorStop(1, 'rgba(6,26,46,0.7)');
    mx.fillStyle = g; mx.fillRect(0, 0, W, H);
    g = mx.createRadialGradient(px, py, R * 0.3, px, py, R * 0.78);
    g.addColorStop(0, 'rgba(6,26,46,0)'); g.addColorStop(1, 'rgba(6,26,46,0.75)');
    mx.fillStyle = g; mx.fillRect(0, 0, W, H);
  }

  setup();
  addEventListener('resize', function () { setup(); draw(6); });
  if (still) { draw(6); return; }
  (function loop(ms) { draw((ms || 0) / 1000 + 6); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
