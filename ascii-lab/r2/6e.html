<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>r2/6e eclipse, stripped</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;height:100%;background:#061a2e;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style>
</head><body><canvas id="c"></canvas>
<script src="../kit/palette.js"></script>
<script src="../kit/subjects.js"></script>
<script type="x-shader/x-fragment" id="fs">#version 300 es
precision highp float;
out vec4 o;
uniform vec2 R,CELL,GRID;
uniform float T;
uniform sampler2D buf,aux,atlas,ramp;
const float NR=14.;
const vec3 H=vec3(.024,.102,.18),RS=vec3(.043,.165,.275),RH=vec3(.071,.227,.361),F=vec3(.965,.984,1.),
  MINT=vec3(.616,.941,.659),ID=vec3(.478,.431,.878);
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+1.),f.x),f.y);}
float gly(float row,float idx,vec2 gp){return texture(atlas,(vec2(idx,row)+clamp(gp,.001,.999))*vec2(16.,32.)/vec2(256.,64.)).r;}
vec3 arc(float u){return texture(ramp,vec2(mix(.01,.99,clamp(u,0.,1.)),.5)).rgb;}
vec4 B(vec2 c){return texture(buf,(clamp(c,vec2(0.),GRID-1.)+.5)/GRID);}
void main(){
  vec2 px=vec2(gl_FragCoord.x,R.y-gl_FragCoord.y);
  vec2 cell=floor(px/CELL),inC=px/CELL-cell;
  vec2 gp=inC;
  vec2 uv=(cell+.5)/GRID;
  vec4 s=B(cell);
  float lum=s.r,hint=s.g,edge=s.b,mask=s.a;
  vec2 ax=texture(aux,uv).rg;
  float halo=ax.r;                       /* blurred silhouette, 0 far .. 1 inside */
  float hr=h21(cell+7.);
  vec2 q=(cell+.5)/GRID;                 /* 0..1 */
  vec2 cq=(q-vec2(.5,.56))*vec2(GRID.x*CELL.x/R.y,1.);
  float rad=length(cq*vec2(.78,1.));
  /* the ground: tides of light, warm where the mushroom sits, cool and sparse at the rim */
  float w1=vn(vec2(cq.x*1.6+T*.05,cq.y*2.2-T*.04));
  float w2=vn(vec2(cq.x*3.8-T*.09,cq.y*5.+w1*2.));
  float band=sin((cq.x*.9+cq.y*1.3)*3.2+w1*3.+T*.22)*.5+.5;
  float u=.5+.22*(band-.5)+.12*(w2-.5)+.3*halo-.35*smoothstep(.55,1.05,rad);
  u=clamp(u,0.,1.);
  vec3 grad=arc(u);
  /* warm core around the figure, blowing to frost at its rim */
  float core=smoothstep(.15,.8,halo)*(1.-mask);
  grad=mix(grad,F,pow(core,2.5)*.7);
  /* dissolve toward the rim: blocks give way to dashes */
    vec3 col;
  if(mask>.5){
    /* inside: harbor ground, polarity flips with tone */
    vec3 bg=mix(H,RS,smoothstep(.0,.7,lum));
    col=bg;
    float lx=B(cell+vec2(1,0)).r-B(cell-vec2(1,0)).r,ly=(B(cell+vec2(0,1)).r-B(cell-vec2(0,1)).r)*.5;
    vec2 d=vec2(-ly,lx);
    float ratio=abs(d.y)/max(abs(d.x),1e-4);
    float li=ratio<.42?0.:ratio>2.4?1.:(d.x*d.y>0.?3.:2.);
    float line=gly(1.,li,gp);
    vec3 ink=arc(clamp(hint*.8+.1,0.,1.));
    if(lum>.88){ col=F; col=mix(col,bg,gly(0.,3.+floor(hr*3.),gp)*.15); }
    else if(lum>.62||edge>.45){
      vec3 c=mix(ink,F,smoothstep(.62,.9,lum)*.85);
      col=mix(bg,c,line*(.55+.45*smoothstep(.4,.9,lum+edge*.3)));
    }
  } else {
    /* outside: gradient is the ground, glyphs are cut out of it to harbor */
    float cut=.04+.3*smoothstep(.15,.7,1.-halo)*(.7+.3*w2);
    cut=mix(cut,.32,core*.8);
    float ri=floor(clamp(cut,0.,1.)*NR*.999);
    float hole=gly(0.,ri,gp);
    float blockA=1.-hole*smoothstep(.0,.5,cut);
    col=mix(H,grad,.96*blockA);
    /* a harbor halo gap hugging the silhouette so the figure is carved, not pasted */
    float gap=smoothstep(.93,.99,halo);
    col=mix(col,H,gap*.92);
    /* the rim simply sinks into the harbor */
    col=mix(col,H,smoothstep(.4,1.0,rad+(w2-.5)*.15)*.92);
  }
  /* mint: one live cell orbiting the cap */
  vec2 mc=floor(GRID*.5+vec2(cos(T*.35)*GRID.y*.62*CELL.y/CELL.x*.85,sin(T*.35)*GRID.y*.34));
  if(cell==mc){ col=mix(H,MINT,gly(1.,4.,gp)*.95+.05*0.); }
    o=vec4(col,1);
}
</script>
<script>
(function(){
  'use strict';
  var S=window.LabSubjects,Pal=window.LabPalette;
  var still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv=document.getElementById('c'),gl=cv.getContext('webgl2',{antialias:false});
  if(!gl){document.body.style.background='#061a2e';return;}
  function mk(t,src){var s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
  var pr=gl.createProgram();
  gl.attachShader(pr,mk(gl.VERTEX_SHADER,'#version 300 es\nvoid main(){vec2 p=vec2(gl_VertexID&1,gl_VertexID>>1&1)*2.;gl_Position=vec4(p*2.-1.,0,1);}'));
  gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent.trim()));
  gl.linkProgram(pr);gl.useProgram(pr);
  function U(n){return gl.getUniformLocation(pr,n);}
  function tex(unit,filter){var t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,filter);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,filter);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t;}
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
  tex(0,gl.NEAREST);tex(1,gl.NEAREST);
  /* glyph atlas: row 0 sorted by measured coverage, row 1 line + accent glyphs */
  var at=document.createElement('canvas');at.width=256;at.height=64;var ax=at.getContext('2d');
  ax.font='bold 26px ui-monospace, Menlo, monospace';ax.textBaseline='middle';ax.textAlign='center';
  function cov(ch){var c=document.createElement('canvas');c.width=16;c.height=32;var x=c.getContext('2d');x.font='bold 26px ui-monospace, Menlo, monospace';x.textBaseline='middle';x.textAlign='center';x.fillStyle='#fff';
    if(ch==='#B')x.fillRect(0,0,16,32);else x.fillText(ch,8,17);var d=x.getImageData(0,0,16,32).data,s=0;for(var i=0;i<d.length;i+=4)s+=d[i];return s;}
  var set=[' ','.',',',':',';','-','=','+','*','x','%','#','@','#B'];
  var meas=set.map(function(c){return[c,c==='#B'?1e9:cov(c)];}).sort(function(a,b){return a[1]-b[1];});
  ax.fillStyle='#fff';
  meas.forEach(function(m,i){if(m[0]==='#B')ax.fillRect(i*16,0,16,32);else ax.fillText(m[0],i*16+8,17);});
  var row1=['-','|','/','\\','*','x','.'];
  /* thin line glyphs drawn as strokes so they read at any size */
  ax.strokeStyle='#fff';ax.lineWidth=3;ax.lineCap='butt';
  function ln(i,x1,y1,x2,y2){ax.beginPath();ax.moveTo(i*16+x1,32+y1);ax.lineTo(i*16+x2,32+y2);ax.stroke();}
  ln(0,0,16,16,16);ln(1,8,0,8,32);ln(2,15,2,1,30);ln(3,1,2,15,30);
  ax.fillText('*',4*16+8,32+17);ax.fillText('x',5*16+8,32+17);ax.fillText('.',6*16+8,32+17);
  gl.activeTexture(gl.TEXTURE2);var ta=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,ta);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,at);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  /* atlas alpha lives in r after the rgba upload only if white on transparent: use alpha */
  gl.activeTexture(gl.TEXTURE3);var tr=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tr);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,256,1,0,gl.RGBA,gl.UNSIGNED_BYTE,Pal.lut(256));
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.uniform1i(U('buf'),0);gl.uniform1i(U('aux'),1);gl.uniform1i(U('atlas'),2);gl.uniform1i(U('ramp'),3);

  var sub,sw,sh,ox,oy,cols,rows,cw,ch,buf,bytes=null,auxB,tmpA,tmpB;
  function size(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);
    gl.viewport(0,0,cv.width,cv.height);
    cw=Math.max(6,Math.round(cv.height/92));ch=cw*2;
    cols=Math.ceil(cv.width/cw);rows=Math.ceil(cv.height/ch);
    buf=S.create(cols,rows,cw/ch);bytes=null;
    sw=Math.round(cols*.7);sh=Math.round(rows*.7);sub=S.create(sw,sh,cw/ch);ox=Math.round((cols-sw)/2);oy=Math.round((rows-sh)*.62);
    auxB=new Uint8Array(cols*rows*4);tmpA=new Float32Array(cols*rows);tmpB=new Float32Array(cols*rows);
    gl.activeTexture(gl.TEXTURE0);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,cols,rows,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    gl.activeTexture(gl.TEXTURE1);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,cols,rows,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    gl.uniform2f(U('R'),cv.width,cv.height);gl.uniform2f(U('CELL'),cw,ch);gl.uniform2f(U('GRID'),cols,rows);
  }
  /* separable box blur of the mask, twice, radius in cells: the halo field */
  function blur(src,dst,tmp,r){
    var w=cols,h=rows,x,y,k,a,n=2*r+1;
    for(y=0;y<h;y++){a=0;for(k=-r;k<=r;k++)a+=src[y*w+Math.min(w-1,Math.max(0,k))];
      for(x=0;x<w;x++){tmp[y*w+x]=a/n;a+=src[y*w+Math.min(w-1,x+r+1)]-src[y*w+Math.max(0,x-r)];}}
    var rv=Math.max(1,Math.round(r*.5)),nv=2*rv+1;
    for(x=0;x<w;x++){a=0;for(k=-rv;k<=rv;k++)a+=tmp[Math.min(h-1,Math.max(0,k))*w+x];
      for(y=0;y<h;y++){dst[y*w+x]=a/nv;a+=tmp[Math.min(h-1,y+rv+1)*w+x]-tmp[Math.max(0,y-rv)*w+x];}}
  }
  var halo=null,halo2=null;
  function frame(t){
    S.fill('mushroom',sub,t);
    var a,b,x,y;['lum','hint','edge','mask'].forEach(function(k){buf[k].fill(0);});
    for(y=0;y<sh;y++)for(x=0;x<sw;x++){a=y*sw+x;b=(y+oy)*cols+x+ox;buf.lum[b]=sub.lum[a];buf.hint[b]=sub.hint[a];buf.edge[b]=sub.edge[a];buf.mask[b]=sub.mask[a];}
    bytes=S.toRGBA(buf,bytes);
    if(!halo){halo=new Float32Array(cols*rows);halo2=new Float32Array(cols*rows);}
    var r=Math.max(2,Math.round(rows*.09));
    blur(buf.mask,halo,tmpA,r);blur(halo,halo2,tmpB,r);
    for(var i=0,n=cols*rows;i<n;i++){var v=Math.min(1,halo2[i]*1.9+buf.mask[i]*.3);auxB[i*4]=v*255;auxB[i*4+1]=0;auxB[i*4+3]=255;}
    gl.activeTexture(gl.TEXTURE0);gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,cols,rows,gl.RGBA,gl.UNSIGNED_BYTE,bytes);
    gl.activeTexture(gl.TEXTURE1);gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,cols,rows,gl.RGBA,gl.UNSIGNED_BYTE,auxB);
    gl.uniform1f(U('T'),t);gl.drawArrays(gl.TRIANGLES,0,3);
  }
  size();
  addEventListener('resize',function(){size();if(still)frame(4);});
  if(still){frame(4);return;}
  (function loop(ms){frame((ms||0)/1000+4);requestAnimationFrame(loop);})();
})();
</script></body></html>
