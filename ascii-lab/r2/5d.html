<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2/5d Lit screen, cut glyphs</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #061a2e; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #u { image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="u"></canvas><canvas id="g"></canvas>
<script src="../kit/palette.js"></script>
<script>
/* Negative space. The gradient is the ground: rose-led, flat per cell, pooling across the whole screen.
   Glyphs are not drawn on it, they are cut out of it. Giant +, /, x, #, %, * are holes in the light; harbor
   shows through. Size is colour: where the field is sky the holes are small, iris medium, rose huge.
   The cut-outs harbor a small live glyph of the same arc, so the light that was removed is kept inside. */
(function () {
  'use strict';
  var P = LabPalette, still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var harbor = P.resolve('harbor'), frost = P.resolve('frost'), raised = P.resolve('raised');
  var uc = document.getElementById('u'), gc = document.getElementById('g');
  var ux = uc.getContext('2d'), gx = gc.getContext('2d');
  var mk = document.createElement('canvas'), mx = mk.getContext('2d', { willReadFrequently: true });
  var sm = document.createElement('canvas'), sx = sm.getContext('2d', { willReadFrequently: true });
  var cols, rows, cw, ch, dpr, uimg, atlas, W, H;
  var NB = 28, GL = '.:-=+x/|*#%', SHAPES = '+/x#%*';
  var MONO = 'ui-monospace, "SF Mono", Menlo, monospace';

  function lerp3(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function hash(a, b) { var h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }

  /* field t in 0..1 along the arc, domain warped, leaning to the pink end */
  function field(x, y, t) {
    var wx = x + 0.35 * Math.sin(y * 2.1 + t * 0.35) + 0.2 * Math.sin(y * 4.3 - t * 0.5);
    var wy = y + 0.35 * Math.sin(x * 1.7 - t * 0.3) + 0.2 * Math.cos(x * 3.9 + t * 0.4);
    var v = 0.5 + 0.28 * Math.sin(wx * 2.3 + wy * 1.1 + t * 0.2) + 0.2 * Math.sin(wy * 3.1 - wx * 1.4 - t * 0.25) + 0.1 * Math.sin((wx + wy) * 5.2);
    v = (v - 0.5) * 1.5 + 0.5 + (y - 0.5) * 0.3 - (0.5 - x) * 0.25 - 0.02;     /* sky sits top-left, rose pools low-right */
    return Math.max(0, Math.min(1, v));
  }

  var GC = [], UC = [];       /* per bin: ground colour, glyph colour for inside holes */
  (function () {
    for (var b = 0; b < NB; b++) {
      var t = b / (NB - 1), a = P.arc(t);
      UC.push(a);
      GC.push(t > 0.55 ? lerp3(a, P.resolve('raspberry'), 0.12) : lerp3(a, frost, 0.06));
    }
  })();

  function setup() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cw = Math.max(9, Math.round(W / 150)); ch = Math.round(cw * 1.8);
    cols = Math.ceil(W / cw); rows = Math.ceil(H / ch);
    gc.width = cols * cw * dpr; gc.height = rows * ch * dpr;
    gc.style.width = cols * cw + 'px'; gc.style.height = rows * ch + 'px';
    uc.width = cols; uc.height = rows; uc.style.width = cols * cw + 'px'; uc.style.height = rows * ch + 'px';
    uimg = ux.createImageData(cols, rows);
    mk.width = Math.round(cols * cw / 2); mk.height = Math.round(rows * ch / 2);
    sm.width = cols; sm.height = rows;
    var pw = Math.round(cw * dpr), ph = Math.round(ch * dpr);
    atlas = document.createElement('canvas'); atlas.width = pw * GL.length; atlas.height = ph * NB * 3;
    var ax = atlas.getContext('2d');
    ax.font = '700 ' + Math.round(ch * 0.78 * dpr) + 'px ' + MONO;
    ax.textAlign = 'center'; ax.textBaseline = 'middle';
    for (var k = 0; k < NB * 3; k++) {
      var c = k < NB ? lerp3(GC[k], harbor, 0.5) : k < NB * 2 ? lerp3(UC[k - NB], frost, 0.1) : lerp3(UC[k - NB * 2], frost, 0.7);   /* rows 0..NB: ground ticks, NB..: hole glyphs */
      ax.fillStyle = P.toCss(c);
      for (var q = 0; q < GL.length; q++) ax.fillText(GL[q], q * pw + pw / 2, k * ph + ph / 2 + 1);
    }
    atlas.pw = pw; atlas.ph = ph;
  }

  /* the cut-out layer: three lattices, kept by arc position at the lattice point (size is colour) */
  function drawMask(t) {
    var w = mk.width, h = mk.height, s = 0.5;
    mx.setTransform(1, 0, 0, 1, 0, 0);
    mx.globalCompositeOperation = 'source-over'; mx.fillStyle = '#000'; mx.fillRect(0, 0, w, h);
    mx.globalCompositeOperation = 'lighter'; mx.textAlign = 'center'; mx.textBaseline = 'middle';
    var unit = Math.max(W, H * 1.4);
    var levels = [{ size: unit * 0.46, lo: 0.62, hi: 9 }, { size: unit * 0.23, lo: 0.36, hi: 0.62 }, { size: unit * 0.115, lo: -1, hi: 0.36 }];
    for (var li = 0; li < 3; li++) {
      var L = levels[li], sz = L.size, stepX = sz * 0.78, stepY = sz * 0.78;
      var drift = (t * (li === 0 ? 14 : li === 1 ? 6 : 2.5)) % stepX;
      mx.fillStyle = li === 0 ? '#00f' : li === 1 ? '#0f0' : '#f00';
      mx.font = '800 ' + Math.round(sz * s) + 'px ' + MONO;
      var nr = Math.ceil(H / stepY) + 2, nc = Math.ceil(W / stepX) + 3;
      for (var r = -1; r < nr; r++) {
        for (var c = -2; c < nc; c++) {
          var px = c * stepX + (r & 1 ? stepX * 0.5 : 0) - drift + (hash(c, r + li * 91) - 0.5) * stepX * 0.25;
          var py = r * stepY + (hash(r, c + li * 17) - 0.5) * stepY * 0.25;
          var ft = field(px / W, py / H, t);
          if (ft < L.lo || ft >= L.hi) continue;
          var ch1 = SHAPES[Math.floor(hash(c + li * 7, r * 3 + li) * SHAPES.length)];
          mx.fillText(ch1, px * s, py * s + sz * s * 0.04);
        }
      }
    }
  }

  var cov, orbBuf;
  function covAt(x, y) { x = x < 0 ? 0 : x >= cols ? cols - 1 : x; y = y < 0 ? 0 : y >= rows ? rows - 1 : y; return cov[y * cols + x]; }
  var IRD = lerp3(P.resolve('irisDeep'), harbor, 0.55), PEACH = P.resolve('peach'), HAZE = P.resolve('haze'), RASP = P.resolve('raspberry');
  /* the lamp: peach rim, haze body, frost heart */
  function lamp(a, g) {
    var c = lerp3(g, PEACH, Math.min(1, a * 1.6));
    if (a > 0.35) c = lerp3(c, HAZE, Math.min(1, (a - 0.35) * 1.8));
    if (a > 0.7) c = lerp3(c, frost, Math.min(1, (a - 0.7) * 3));
    return c;
  }

  function frame(t) {
    drawMask(t);
    sx.imageSmoothingEnabled = true; sx.imageSmoothingQuality = 'high';
    sx.drawImage(mk, 0, 0, cols, rows);
    var m = sx.getImageData(0, 0, cols, rows).data, d = uimg.data;
    var pw = atlas.pw, ph = atlas.ph, cwp = cw * dpr, chp = ch * dpr;
    var n = cols * rows;
    if (!cov || cov.length !== n) cov = new Float32Array(n);
    for (var q = 0; q < n; q++) cov[q] = Math.max(m[q * 4], m[q * 4 + 1], m[q * 4 + 2]) / 255;
    /* the luminous object sits behind the screen and breathes */
    var asp = (cols * cw) / (rows * ch);
    var ox = 0.6 + 0.06 * Math.sin(t * 0.13), oy = 0.46 + 0.05 * Math.cos(t * 0.17), breath = 0.92 + 0.08 * Math.sin(t * 0.9);
    gx.clearRect(0, 0, gc.width, gc.height);
    var k = 0;
    for (var y = 0; y < rows; y++) {
      for (var x = 0; x < cols; x++, k++) {
        var cv = cov[k], j = k * 4;
        var fx = (x + 0.5) / cols, fy = (y + 0.5) / rows;
        var ft = field(fx, fy, t);
        var b = Math.min(NB - 1, Math.floor(ft * NB));
        var g = GC[b];
        /* light: radial core, wide halo, slow rays */
        var dx = (fx - ox) * asp, dy = fy - oy, dd = Math.sqrt(dx * dx + dy * dy), ang = Math.atan2(dy, dx);
        var rays = 0.82 + 0.18 * Math.sin(ang * 7 + t * 0.2) * Math.sin(ang * 3 - t * 0.11);
        var core = Math.exp(-dd * dd / 0.005) * breath;
        var halo = Math.exp(-dd / 0.34) * 0.62 * rays * breath;
        var glow = Math.min(1, Math.round((core + halo) * 14) / 14);          /* quantised: flat steps, like the field */
        /* air: slow fog bands and a vignette that sinks to deep iris */
        var fog = 0.5 + 0.5 * Math.sin(fx * 5 + fy * 9 - t * 0.12 + Math.sin(fy * 6 + t * 0.07) * 1.6);
        fog = Math.round(fog * 6) / 6;
        var vig = Math.pow(Math.max(Math.abs(fx - 0.5) * 1.5, Math.abs(fy - 0.5) * 1.8), 2.4);
        var cr = m[j] / 255, cg = m[j + 1] / 255, cb = m[j + 2] / 255;
        var far = (cr * 0.6 + cg * 0.25) / (cr + cg + cb + 0.001);          /* 0 near, 1 far: aerial perspective */
        var u, hh = hash(x, y);
        if (cv > 0.55) {
          var depth = (cv - 0.55) / 0.45;
          /* wall facing away from the lamp catches light; interior sinks to harbor, far holes veil in fog */
          var wall = covAt(x + (fx < ox ? -1 : 1), y) < 0.5 || covAt(x, y + (fy < oy ? -1 : 1)) < 0.5;
          var seen = Math.min(1, glow * (0.4 + 0.8 * Math.max(0, depth - 0.1)) * 1.25);   /* lamp seen through the cut */
          var base = lerp3(harbor, raised, Math.min(1, depth * 0.0 + (1 - depth) * 0.5 + (cb > 0.5 ? 0 : 0.25)));
          base = lerp3(base, lerp3(P.resolve('raisedHi'), UC[b], 0.22), far * 0.6 * (0.6 + 0.4 * fog));
          if (wall && glow > 0.12) base = lerp3(base, lerp3(P.resolve('raised'), P.resolve('irisDeep'), 0.5), Math.min(0.8, glow * 1.3));
          if (seen > 0.4) base = lamp(seen, lerp3(base, lerp3(UC[b], frost, 0.2), Math.min(1, seen * 1.6)));
          d[j] = base[0] * 255; d[j + 1] = base[1] * 255; d[j + 2] = base[2] * 255; d[j + 3] = 255;
          var gi = depth < 0.35 ? (hh < 0.55 ? 1 : 0) : 1 + Math.floor(hh * hh * 10);
          if (seen < 0.75 && depth > 0.15 && hh < 0.22 + depth * 0.45) {
            var set = seen > 0.3 || wall ? 2 : 1;
            gx.drawImage(atlas, Math.min(gi, GL.length - 1) * pw, (NB * set + b) * ph, pw, ph, x * cwp, y * chp, cwp, chp);
          }
        } else {
          u = g;
          /* lamp light spills over the sheet, hottest nearest the core */
          if (glow > 0.04) u = lamp(glow * (1 - cv * 0.3), u);
          /* rim cells burn lighter, hotter on the lamp side */
          if (cv > 0.2) {
            var lit = Math.max(0, covAt(x + (fx < ox ? 1 : -1) * 0, y) - 0);
            u = lerp3(u, frost, Math.min(1, (cv - 0.2) * 0.9 * (0.6 + glow * 0.8)));
          }
          /* cast shadow: holes are thick, the shadow falls away from the lamp */
          var sxo = fx < ox ? -2 : 2, syo = fy < oy ? -1 : 1;
          var sh = Math.max(covAt(x + sxo * -1, y + syo * -1), covAt(x + sxo * -2, y + syo * -2) * 0.7);
          if (cv < 0.2 && sh > 0.55) u = lerp3(u, lerp3(IRD, g, 0.35), (0.5 + 0.2 * (1 - glow)) * sh);
          /* atmosphere: fog lifts the ground toward haze near the lamp, vignette sinks it to deep iris */
          u = lerp3(u, HAZE, fog * 0.07 * (0.4 + glow));
          u = lerp3(u, IRD, Math.min(0.6, vig * 0.5));
          d[j] = u[0] * 255; d[j + 1] = u[1] * 255; d[j + 2] = u[2] * 255; d[j + 3] = 255;
          var h2 = hash(x * 3 + 1, y * 7 + 2);
          if (cv < 0.2 && h2 < 0.16 && glow < 0.7) gx.drawImage(atlas, (h2 < 0.08 ? 1 : 3) * pw, b * ph, pw, ph, x * cwp, y * chp, cwp, chp);
        }
      }
    }
    ux.putImageData(uimg, 0, 0);
  }

  var T0 = 6;
  function boot() { setup(); frame(T0); }
  boot();
  addEventListener('resize', function () { setup(); frame(T0); });
  if (!still) (function loop(ms) { frame((ms || 0) / 1000 + T0); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
