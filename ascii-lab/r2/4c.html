<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mushroom, light through cells</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #061a2e; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../kit/palette.js"></script>
<script src="../kit/subjects.js"></script>
<script>
(function () {
  'use strict';
  var S = LabSubjects, Pal = LabPalette;
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv = document.getElementById('c'), cx = cv.getContext('2d');
  var inks = Pal.cssLut(128), HARBOR = '#061a2e', FROST = '#f6fbff', RAISED = '#0b2a46', RAISEDHI = '#123a5c';
  var IRISD = '#7a6ee0', CER = '#1a8fc0', LAG = '#3fb8d0', RASP = '#c2407a';
  var W, H, CW, CH, cols, rows, buf, dpr;
  var PEACH = '#f8928a', HAZE = '#cec1be';
  var px = -1, py = -1, mx = -1, my = -1, mon = 0, mvis = 0;

  function hash(i, j) { var s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); }

  function setup() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    CW = Math.max(10, Math.round(W / 84)); CH = Math.max(5, Math.round(CW * 0.5));
    cols = Math.ceil(W / CW) + 1; rows = Math.ceil(H / CH) + 1;
    buf = S.create(cols, rows, CW / CH);
  }

  var ca = Math.cos(0.42), sa = Math.sin(0.42), bc = 0, CR = 150;
  function draw(t) {
    var B = buf, i, r, c;
    var ph = still ? 0.42 : (t / 12) % 1;
    bc = -0.25 + 1.6 * ph;
    if (mon) { mx += (px - mx) * 0.14; my += (py - my) * 0.14; mvis += (1 - mvis) * 0.1; }
    else mvis *= 0.95;
    CR = Math.max(110, W * 0.11);
    S.fill('mushroom', B, t);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.fillStyle = HARBOR; cx.fillRect(0, 0, W, H);
    for (r = 0; r < rows; r++) {
      var y0 = r * CH;
      for (c = 0; c < cols; c++) {
        i = r * cols + c;
        var l = B.lum[i], h = B.hint[i], m = B.mask[i], e = B.edge[i];
        /* light moving through the material: a slow diagonal band with a soft trailing tail, plus the cursor lens */
        var X = c * CW, Y = r * CH;
        var dd = (X / W) * ca + (Y / W) * sa - bc;
        var lg = dd < 0 ? Math.exp(-dd * dd / 0.05) * 0.55 : Math.exp(-dd * dd / 0.006);
        lg *= 0.3 + 0.7 * m;
        lg *= 0.8 + 0.4 * S.noise(c * 0.15 - t * 0.3, r * 0.3 + t * 0.12);
        var cdx = X - mx, cdy = (Y - my) * 2, cd2 = cdx * cdx + cdy * cdy, cl = mvis * Math.exp(-cd2 / (CR * CR));
        var lt = Math.min(1, lg + cl * 1.1);
        l = Math.min(1, l + 0.3 * lt); h = Math.max(0, h - 0.18 * lt + 0.08 * cl);
        /* mass: how much cell is "there". subject is dense, background thin */
        var mass = Math.max(0, Math.min(1, (l - 0.1) * 1.55 + m * 0.15)); if (m < 0.5) mass *= 0.6 + 0.4 * m;
        mass = Math.min(1, mass + 0.22 * lt);
        var drift = S.noise(c * 0.22 + t * 0.07, r * 0.4 - t * 0.05);
        var hh = hash(c, r), hv = hash(r + 91, c + 17);
        var x0 = c * CW;
        var tint = inks[Math.min(127, Math.floor(Math.max(0, Math.min(1, 0.1 + 0.66 * h + 0.06 * (drift - 0.5))) * 127))];
        if (lt > 0.5 && hh < (lt - 0.45) * 1.5) tint = lt > 0.97 && hv < 0.3 ? HAZE : PEACH;
        if (mass > 0.62) {
          /* body: stretched rectangles tiling, narrowing as mass thins */
          var gap = 1 + (0.8 - mass) * 3;
          var ww = CW - (mass > 0.8 ? 1 : 1 + (0.8 - mass) * CW * 0.8);
          var xo = (CW - ww) * hh;
          if (l > 0.86 || lt > 0.99) cx.fillStyle = FROST;
          else cx.fillStyle = tint;
          cx.fillRect(x0 + xo, y0, ww, CH - (gap > 2 ? 2 : 1));
          /* shadow polarity: harbor slit cut into deep body cells */
          if (l < 0.42 && m > 0.5 && e < 0.5 && hh < 0.7) {
            cx.fillStyle = HARBOR; cx.fillRect(x0 + CW * 0.15, y0 + CH * 0.38, CW * 0.7, Math.max(1, CH * 0.16));
          }
          /* edge lines in the bright pass: rim bar, frost */
          if (e > 0.55 && l > 0.5 && hv < e) {
            cx.fillStyle = l > 0.7 ? FROST : LAG;
            cx.fillRect(x0 + CW * 0.1, y0 + CH * 0.4, CW * 0.8, Math.max(1, CH * 0.2));
          }
        } else if (mass > 0.07) {
          /* dissolve: cells keep their width, shed height, then drop out and slide */
          var k = mass / 0.62;
          var keep = k * 1.7 + (drift - 0.5) * 0.9;
          if (hh > keep) {
            /* ghost: a faint raised dash where a cell used to be */
            if (hv < 0.35 * k + 0.05) { cx.fillStyle = RAISEDHI; cx.fillRect(x0 + CW * 0.1, y0 + CH * 0.42, CW * 0.8, 1); }
            continue;
          }
          var th = Math.max(1, CH * (0.14 + 0.7 * k * k));
          var wd = CW * (0.35 + 0.65 * Math.min(1, k * 1.3));
          var sh = (1 - k) * CW * 1.9 * (hv - 0.5) * 2 + (1 - k) * 6 * Math.sin(t * 0.6 + r * 0.7);
          if (cl > 0.02) sh += (X - mx) / (Math.sqrt(cd2) + 30) * cl * CW * 2.2;
          var dx = x0 + (CW - wd) / 2 + sh, dy = y0 + (CH - th) / 2;
          cx.fillStyle = tint; cx.globalAlpha = 0.45 + 0.55 * Math.min(1, k * 1.4);
          if (k < 0.5 && hv > 0.8) cx.fillStyle = Pal.toCss(Pal.arc(0.7 + 0.2 * hv));
          cx.fillRect(dx, dy, wd, th);
          cx.globalAlpha = 1;
        } else if (hh > 0.985) {
          /* far spores: single dashes in sky */
          cx.fillStyle = RAISEDHI; cx.fillRect(x0 + CW * 0.25, y0 + CH * 0.45, CW * 0.5, 1);
        }
      }
    }
  }

  addEventListener('pointermove', function (e) { px = e.clientX; py = e.clientY; if (!mon) { mx = px; my = py; } mon = 1; });
  document.addEventListener('pointerleave', function () { mon = 0; });
  setup();
  addEventListener('resize', function () { setup(); draw(6); });
  if (still) { draw(6); return; }
  (function loop(ms) { draw((ms || 0) / 1000 + 6); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
