<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2/8a Gill bloom, rose lead</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: radial-gradient(120% 100% at 50% 55%, #0b2a46 0%, #061a2e 70%); overflow: hidden; }
  canvas { position: fixed; left: 0; top: 0; display: block; }
  #b1 { filter: blur(2.2vmin); mix-blend-mode: screen; opacity: .95; }
  #b2 { filter: blur(7vmin); mix-blend-mode: screen; opacity: .8; }
  
</style>
</head>
<body>
<canvas id="b2"></canvas><canvas id="b1"></canvas><canvas id="g"></canvas>
<script src="../kit/palette.js"></script>
<script>
/* Glyph bloom, close crop of a mushroom's gills and rim, seen from beneath with the light behind the cap.
   Gills are a radial fan (own procedural field, no photo). Ground is bare harbor. Only the densest glyphs
   (thin, lit gill edges and the rim) emit: their colour is splatted into two low-res layers, blurred wide,
   and screened into the ground, so the light that fills the dark is the glyphs' own. Dim glyphs stay flat. */
(function () {
  'use strict';
  var P = LabPalette;
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var GL = ' .:-=+x/|\\*#%@';
  var G = {}; for (var i = 0; i < GL.length; i++) G[GL[i]] = i;
  var HB = 32, LV = 4, EXTRA = 3;     /* hue bins, level bins, extra colours: lagoon, frost, mint */
  var harbor = P.resolve('harbor'), raised = P.resolve('raised');

  var gc = document.getElementById('g'), b1 = document.getElementById('b1'), b2 = document.getElementById('b2');
  var gx = gc.getContext('2d'), x1 = b1.getContext('2d'), x2 = b2.getContext('2d');
  var cols, rows, cw, ch, dpr, atlas, pw, ph, img1, img2, W, H, asp;

  function lerp3(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function sm(a, b, x) { x = (x - a) / (b - a); x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); }

  /* pink-led ramp: blues recede to ground, raspberry and rose carry the light */
  var PS = [[0, '#123a5c'], [0.18, 'cerulean'], [0.34, 'iris deep'], [0.45, 'raspberry'], [0.8, 'rose'], [1, '#f08fb4']];
  function pink(t) {
    var k = 0; while (k < PS.length - 2 && t > PS[k + 1][0]) k++;
    var a = PS[k], b = PS[k + 1];
    return P.mix(a[1], b[1], Math.max(0, Math.min(1, (t - a[0]) / (b[0] - a[0]))));
  }
  var COL = [];                       /* rows of the atlas */
  (function () {
    for (var h = 0; h < HB; h++) for (var l = 0; l < LV; l++) {
      var c = pink(h / (HB - 1));
      COL.push(lerp3(lerp3(raised, c, 0.5), c, l / (LV - 1)));
    }
    COL.push(lerp3(P.resolve('cerulean'), raised, 0.35), P.mix('frost', 'rose', 0.5), P.resolve('mint'));
  })();
  var LAG = HB * LV, FRO = LAG + 1, MNT = LAG + 2;

  function setup() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cw = Math.max(7, Math.round(Math.max(W, H * 1.2) / 150)); ch = Math.round(cw * 1.8);
    cols = Math.ceil(W / cw); rows = Math.ceil(H / ch);
    asp = cols * cw / (rows * ch);
    gc.width = Math.round(W * dpr); gc.height = Math.round(H * dpr);
    gc.style.width = W + 'px'; gc.style.height = H + 'px';
    [b1, b2].forEach(function (c) {
      c.width = cols; c.height = rows;
      c.style.width = cols * cw + 'px'; c.style.height = rows * ch + 'px';
    });
    img1 = x1.createImageData(cols, rows); img2 = x2.createImageData(cols, rows);
    pw = Math.round(cw * dpr); ph = Math.round(ch * dpr);
    atlas = document.createElement('canvas'); atlas.width = pw * GL.length; atlas.height = ph * COL.length;
    var ax = atlas.getContext('2d');
    ax.font = '700 ' + Math.round(ch * 0.8 * dpr) + 'px ui-monospace, "SF Mono", Menlo, monospace';
    ax.textAlign = 'center'; ax.textBaseline = 'middle';
    for (var k = 0; k < COL.length; k++) {
      ax.fillStyle = P.toCss(COL[k]);
      for (var q = 1; q < GL.length; q++) ax.fillText(GL[q], q * pw + pw / 2, k * ph + ph / 2 + 1);
    }
  }

  function hash(i, j) { var s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); }

  var CX = -0.2, CY = -1.45, R0 = 2.05, NG = 118, TAU = Math.PI * 2;

  function frame(t) {
    var d1 = img1.data, d2 = img2.data;
    d1.fill(0); d2.fill(0);
    gx.setTransform(1, 0, 0, 1, 0, 0);
    /* ground: bare harbor, a little raised blue where the light will land */
    gx.clearRect(0, 0, gc.width, gc.height);
    var cwp = pw, chp = ph, drift = t * 0.012;
    /* the light's travelling hot spot along the rim */
    var hotA = 1.25 + 0.55 * Math.sin(t * 0.13);
    var tipA = 1.0 + 0.9 * (0.5 + 0.5 * Math.sin(t * 0.07)), k = 0;

    for (var y = 0; y < rows; y++) {
      for (var x = 0; x < cols; x++, k++) {
        var X = ((x + 0.5) / cols * 2 - 1) * asp, Y = 1 - (y + 0.5) / rows * 2;
        var dx = X - CX, dy = Y - CY, r = Math.sqrt(dx * dx + dy * dy);
        var th = Math.atan2(dy, dx);                     /* screen angle, up positive */
        var ph0 = th + drift;
        var rim = R0 + 0.045 * Math.sin(th * 7 + 1.3) + 0.03 * Math.sin(th * 19 + t * 0.05);
        var off = r - rim;                               /* <0 under the cap, >0 beyond the rim */

        var d = 0, hue = 0.2, lag = false;
        /* light: a pool swelling where the rim catches the backlight */
        var pool = Math.exp(-Math.pow((th - hotA) * 1.6, 2));
        if (off < 0) {
          /* gills: lamellae with forks that start part-way out */
          var u = ph0 * NG, w1 = 0.5 + 0.5 * Math.cos(u + 0.6 * Math.sin(r * 5 + th * 3));
          var w2 = 0.5 + 0.5 * Math.cos(u * 0.5 + 1.1);
          var fork = sm(rim - 1.05, rim - 0.55, r);
          var g = Math.pow(w1, 3.2) * (1 - fork * 0.5);
          var u2 = ph0 * NG * 2, w3 = 0.5 + 0.5 * Math.cos(u2 + 2.0);
          g = Math.max(g, fork * Math.pow(w3, 4.5) * 0.85);
          var inward = sm(rim - 1.7, rim - 0.04, r);     /* thin and lit toward the rim, dark in */
          var L = 0.16 + 0.55 * inward * inward + 0.5 * pool * inward;
          d = g * L * 1.15;
          var edge = sm(-0.16, -0.02, off);              /* rim band */
          d = Math.max(d, edge * (0.55 + 0.45 * Math.pow(w1, 0.5)) * (0.7 + 0.5 * pool));
          hue = 0.22 + 0.5 * inward + 0.22 * pool * inward - 0.05 * (1 - g);
          if (off > -0.035) { d = Math.max(d, 0.97); hue = 0.74 + 0.3 * pool; }
        } else {
          /* beyond the rim: the cap's edge dissolves, a cyan fringe then sparse dashes */
          var f = Math.exp(-off * 7.5);
          d = 0.5 * f * (0.35 + 0.65 * hash(x, y)) + 0.14 * pool * Math.exp(-off * 2.5);
          hue = 0.55; lag = off < 0.07;
          if (off < 0.035) { d = Math.max(d, 0.9); lag = true; }
        }
        d = d > 1 ? 1 : d < 0 ? 0 : d;
        hue = 0.22 + 0.72 * hue; hue = hue > 1 ? 1 : hue < 0 ? 0 : hue;

        /* glyph choice */
        var gi = 0;
        var hv = hash(x + 5, y + 9);
        if (d > 0.9) gi = hv > 0.55 ? G['@'] : G['%'];
        else if (d > 0.74) gi = hv > 0.5 ? G['#'] : G['*'];
        else if (d > 0.22) {
          var a = ((th % Math.PI) + Math.PI) % Math.PI;  /* gill runs radially */
          if (off > 0) a = ((th + Math.PI / 2) % Math.PI + Math.PI) % Math.PI;
          var s = Math.floor(a / (Math.PI / 4) + 0.5) % 4;
          gi = G[['-', '/', '|', '\\'][s]];
          if (d < 0.36) gi = hv > 0.5 ? G['-'] : G['.'];
        } else if (d > 0.07 && hv < d * 3.2) gi = hv > 0.5 ? G['.'] : G[':'];
        if (!gi) continue;

        var lvl = d < 0.3 ? 0 : d < 0.55 ? 1 : d < 0.8 ? 2 : 3, ci;
        if (lag) ci = d > 0.85 ? FRO : LAG;
        else ci = Math.round(hue * (HB - 1)) * LV + lvl;
        if (d > 0.97 && !lag && pool > 0.5) ci = FRO;      /* hottest cells blow toward frost */
        /* mint: one live cell riding the rim */
        if (Math.abs(th - tipA) < 0.012 && off < 0 && off > -0.06) ci = MNT;
        gx.drawImage(atlas, gi * pw, ci * ph, pw, ph, x * cwp, y * chp, cwp, chp - dpr);

        /* only the densest emit */
        if (d > 0.62) {
          var e = sm(0.62, 1, d), c = ci === MNT ? COL[MNT] : lerp3(COL[ci], COL[Math.min(HB * LV - 1, Math.round(hue * (HB - 1)) * LV + 3)], 0.4); if (ci !== MNT) c = lerp3(c, P.resolve('raspberry'), 0.35);
          if (ci === MNT) e *= 0.5;
          var j = k * 4;
          d1[j] = c[0] * 255 * e; d1[j + 1] = c[1] * 255 * e; d1[j + 2] = c[2] * 255 * e; d1[j + 3] = 255;
          d2[j] = c[0] * 255 * e; d2[j + 1] = c[1] * 255 * e; d2[j + 2] = c[2] * 255 * e; d2[j + 3] = 255;
        }
      }
    }
    x1.putImageData(img1, 0, 0); x2.putImageData(img2, 0, 0);
  }

  function boot() { setup(); frame(6); }
  boot();
  addEventListener('resize', function () { setup(); frame(6); });
  if (!still) (function loop(ms) { frame((ms || 0) / 1000 + 6); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
