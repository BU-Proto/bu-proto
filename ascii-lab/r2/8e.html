<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2/8e Gill bloom, pared</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(110% 90% at 50% 40%, #0b2a46 0%, #061a2e 72%); }
  canvas { position: fixed; left: 0; top: 0; display: block; }
  #b { filter: blur(3.6vmin) saturate(1.5); mix-blend-mode: screen; opacity: 1; }
</style>
</head>
<body>
<canvas id="b"></canvas><canvas id="g"></canvas>
<script src="../kit/palette.js"></script>
<script>
/* Pared gill bloom. One gill fan, one rim, one blur. Gills are single-weight strokes following the gill;
   the rim is a row of @. Colour walks iris deep > iris > rose along the gill toward the lit rim; frost appears
   only in the pool where the light is strongest, so the bloom stays rose and never greys. Mint: one live cell. */
(function () {
  'use strict';
  var P = LabPalette;
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var GL = '-/|\\@';
  var HB = 24, LV = 4;
  var harbor = P.resolve('harbor'), raised = P.resolve('raised');
  var gc = document.getElementById('g'), bc = document.getElementById('b');
  var gx = gc.getContext('2d'), bx = bc.getContext('2d');
  var cols, rows, cw, ch, dpr, atlas, pw, ph, img, W, H, asp;

  function lerp3(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function sm(a, b, x) { x = (x - a) / (b - a); x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); }

  /* ramp: deep iris to iris to rose to raspberry-warm rose; levels dim toward raised */
  var stops = [P.resolve('iris deep'), P.resolve('iris'), P.resolve('rose'), P.resolve('rose')];
  function ramp(t) {
    var s = t * 2, k = s < 1 ? 0 : 1, u = s < 1 ? s : s - 1;
    return lerp3(P.mix(stops[k], stops[k + 1], u), P.resolve('rose'), 0);
  }
  var COL = [];
  for (var h = 0; h < HB; h++) for (var l = 0; l < LV; l++) {
    var c = ramp(h / (HB - 1));
    COL.push(lerp3(lerp3(raised, c, 0.5), c, l / (LV - 1)));
  }
  var LAG = COL.length; COL.push(lerp3(raised, P.resolve('lagoon'), 0.62));
  var FRO = COL.length; COL.push(P.resolve('frost'));
  var MNT = COL.length; COL.push(P.resolve('mint'));

  function setup() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cw = Math.max(8, Math.round(Math.max(W, H * 1.2) / 130)); ch = Math.round(cw * 1.8);
    cols = Math.ceil(W / cw); rows = Math.ceil(H / ch);
    asp = cols * cw / (rows * ch);
    gc.width = Math.round(W * dpr); gc.height = Math.round(H * dpr);
    gc.style.width = W + 'px'; gc.style.height = H + 'px';
    bc.width = cols; bc.height = rows;
    bc.style.width = cols * cw + 'px'; bc.style.height = rows * ch + 'px';
    img = bx.createImageData(cols, rows);
    pw = Math.round(cw * dpr); ph = Math.round(ch * dpr);
    atlas = document.createElement('canvas'); atlas.width = pw * GL.length; atlas.height = ph * COL.length;
    var ax = atlas.getContext('2d');
    ax.font = '700 ' + Math.round(ch * 0.78 * dpr) + 'px ui-monospace, "SF Mono", Menlo, monospace';
    ax.textAlign = 'center'; ax.textBaseline = 'middle';
    for (var k = 0; k < COL.length; k++) {
      ax.fillStyle = P.toCss(COL[k]);
      for (var q = 0; q < GL.length; q++) ax.fillText(GL[q], q * pw + pw / 2, k * ph + ph / 2 + 1);
    }
  }

  var CX = -0.2, CY = -1.45, R0 = 2.05, NG = 104;

  function frame(t) {
    var d = img.data; d.fill(0);
    gx.setTransform(1, 0, 0, 1, 0, 0);
    gx.clearRect(0, 0, gc.width, gc.height);
    var drift = t * 0.01, hotA = 1.25 + 0.5 * Math.sin(t * 0.12);
    var tipA = 1.0 + 0.9 * (0.5 + 0.5 * Math.sin(t * 0.07)), k = 0;
    for (var y = 0; y < rows; y++) {
      for (var x = 0; x < cols; x++, k++) {
        var X = ((x + 0.5) / cols * 2 - 1) * asp, Y = 1 - (y + 0.5) / rows * 2;
        var dx = X - CX, dy = Y - CY, r = Math.sqrt(dx * dx + dy * dy), th = Math.atan2(dy, dx);
        var rim = R0 + 0.04 * Math.sin(th * 7 + 1.3);
        var off = r - rim;
        var pool = Math.exp(-Math.pow((th - hotA) * 1.5, 2));
        var gi = -1, lvl = 0, hue = 0, ci = 0, dens = 0, em = 0;
        if (off < 0) {
          var w = 0.5 + 0.5 * Math.cos((th + drift) * NG + 0.6 * Math.sin(r * 5 + th * 3));
          var inward = sm(rim - 1.6, rim - 0.04, r);
          dens = Math.pow(w, 3.4) * (0.18 + 0.82 * inward * inward) * (0.8 + 0.5 * pool * inward);
          if (off > -0.04) {                                  /* the rim: one row of @ */
            gi = 4; dens = 1; hue = 0.8 + 0.2 * pool; lvl = 3;
          } else if (dens > 0.2) {
            var a = ((th % Math.PI) + Math.PI) % Math.PI;
            gi = Math.floor(a / (Math.PI / 4) + 0.5) % 4;
            gi = [0, 1, 2, 3][gi];
            hue = 0.12 + 0.78 * inward;
            lvl = dens < 0.4 ? 0 : dens < 0.6 ? 1 : dens < 0.85 ? 2 : 3;
          }
        } else if (off < 0.045) {                             /* thin lagoon fringe */
          gi = 0; ci = LAG; dens = 0.8;
        }
        if (gi < 0) continue;
        if (ci !== LAG) ci = Math.round(hue * (HB - 1)) * LV + lvl;
        if (gi === 4 && pool > 0.93) ci = FRO;                /* frost only in the pool */
        if (Math.abs(th - tipA) < 0.011 && off < 0 && off > -0.05) ci = MNT;
        gx.drawImage(atlas, gi * pw, ci * ph, pw, ph, x * pw, y * ph, pw, ph - dpr);
        if (dens > 0.7) {
          var e = 1.25 * sm(0.7, 1, dens) * (ci === MNT ? 0.4 : 1);
          var c = ci === FRO || ci === LAG ? COL[Math.round(0.9 * (HB - 1)) * LV + 3] : COL[Math.round(hue * (HB - 1)) * LV + 3];
          var j = k * 4;
          d[j] = c[0] * 255 * e; d[j + 1] = c[1] * 255 * e; d[j + 2] = c[2] * 255 * e; d[j + 3] = 255;
        }
      }
    }
    bx.putImageData(img, 0, 0);
  }

  function boot() { setup(); frame(6); }
  boot();
  addEventListener('resize', boot);
  if (!still) (function loop(ms) { frame((ms || 0) / 1000 + 6); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
