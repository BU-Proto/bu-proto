<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tides, contour glyphs</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #061a2e; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../kit/palette.js"></script>
<script src="../kit/subjects.js"></script>
<script>
(function () {
  'use strict';
  var S = LabSubjects, Pal = LabPalette;
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv = document.getElementById('c'), cx = cv.getContext('2d');
  var harbor = Pal.resolve('harbor'), frost = Pal.resolve('frost'), raised = Pal.resolve('raised');
  var inks = Pal.cssLut(96), HARBOR = '#061a2e', FROST = '#f6fbff';
  var BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  var GL = ['-', '\\', '|', '/'];
  var W, H, CW, CH, cols, rows, buf, under, ux, img, dpr;

  function setup() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    CW = Math.max(8, Math.round(W / 150)); CH = Math.round(CW * 1.8);
    cols = Math.ceil(W / CW); rows = Math.ceil(H / CH);
    buf = S.create(cols * 2, rows * 2, CW / CH);
    under = document.createElement('canvas'); under.width = cols * 2; under.height = rows * 2;
    ux = under.getContext('2d'); img = ux.createImageData(cols * 2, rows * 2);
  }

  /* soft image: lum sinks into harbor, hue leans rose, top blows out to frost */
  function tone(lum, hint, out, j) {
    var c = Pal.arc(0.12 + 0.62 * Math.min(1, hint));
    lum = Math.pow(lum, 0.85) * 0.9;
    var d = Math.min(1, lum * 1.9), w = Math.max(0, lum - 0.62) / 0.3; w = w * w;
    for (var k = 0; k < 3; k++) {
      var v = harbor[k] + (c[k] - harbor[k]) * d;
      out[j + k] = (v + (frost[k] - v) * w) * 255;
    }
    out[j + 3] = 255;
  }

  function draw(t) {
    var B = buf, bw = B.width, i, n = bw * B.height;
    S.fill('tides', B, t);
    for (i = 0; i < n; i++) tone(B.lum[i], B.hint[i], img.data, i * 4);
    ux.putImageData(img, 0, 0);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high';
    cx.drawImage(under, 0, 0, cols * CW, rows * CH);
    cx.textBaseline = 'middle'; cx.textAlign = 'center';
    cx.font = Math.round(CH * 0.86) + 'px ui-monospace, "SF Mono", Menlo, monospace';

    /* cell averages */
    var cl = new Float32Array(cols * rows), ch = new Float32Array(cols * rows), ce = new Float32Array(cols * rows);
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
      var a = (r * 2) * bw + c * 2, k = r * cols + c;
      cl[k] = (B.lum[a] + B.lum[a + 1] + B.lum[a + bw] + B.lum[a + bw + 1]) / 4;
      ch[k] = (B.hint[a] + B.hint[a + 1] + B.hint[a + bw] + B.hint[a + bw + 1]) / 4;
      ce[k] = Math.max(B.edge[a], B.edge[a + 1], B.edge[a + bw], B.edge[a + bw + 1]);
    }
    for (r = 1; r < rows - 1; r++) for (c = 1; c < cols - 1; c++) {
      k = r * cols + c;
      var l = Math.pow(cl[k], 0.85) * 0.9, e = ce[k];
      var gx = cl[k + 1] - cl[k - 1], gy = (cl[k + cols] - cl[k - cols]) * (CH / CW);
      var mag = Math.sqrt(gx * gx + gy * gy);
      /* contour runs perpendicular to the gradient: the lines follow the water */
      var ang = Math.atan2(gy, gx) + Math.PI / 2;
      var q = Math.round(ang / (Math.PI / 4)); q = ((q % 4) + 4) % 4;
      /* screen y is down, so 45 deg reads as '\' ; map: 0 '-', 1 '\', 2 '|', 3 '/' */
      var chr = GL[q];
      var x = c * CW + CW / 2, y = r * CH + CH / 2;
      var th = (BAYER[(r & 3) * 4 + (c & 3)] + 0.5) / 16;
      var col = inks[Math.min(95, Math.floor((0.12 + 0.62 * Math.min(1, ch[k])) * 95))];
      if (l > 0.74 && th < (l - 0.74) * 5) {
        cx.fillStyle = FROST; cx.fillRect(c * CW, r * CH, CW, CH - 1);
      } else if (l > 0.46) {
        if (e > 0.45 && th < e) chr = (q & 1) ? 'x' : '+';
        else if (th > 0.2 + (l - 0.46) * 3) continue;
        cx.fillStyle = FROST; cx.fillText(chr, x, y);
      } else if (l > 0.26) {
        /* midtone: sparse, tinted, on the soft image */
        if (th > (l - 0.26) * 3 + mag * 3) continue;
        cx.fillStyle = col; cx.globalAlpha = 0.9; cx.fillText(chr, x, y); cx.globalAlpha = 1;
      } else if (l > 0.1) {
        /* shadow: thin dark ticks, polarity flipped */
        if (th > (l - 0.1) * 5) continue;
        cx.fillStyle = HARBOR; cx.fillText(mag > 0.02 ? chr : ':', x, y);
      }
    }
  }

  setup();
  addEventListener('resize', function () { setup(); draw(4); });
  if (still) { draw(4); return; }
  (function loop(ms) { draw((ms || 0) / 1000 + 4); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
