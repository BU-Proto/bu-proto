<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>27 tides, partitive</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;height:100%;background:#061a2e;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
(function(){
'use strict';
var cv=document.getElementById('c');
var gl=cv.getContext('webgl2',{antialias:false});
var still=matchMedia('(prefers-reduced-motion: reduce)').matches;
var vs='#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
var fs='#version 300 es\nprecision highp float;\nuniform vec2 R;uniform float T;uniform vec2 cell;out vec4 o;\n'+
'vec3 H(float r,float g,float b){return vec3(r,g,b)/255.;}\n'+
'float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}\n'+
'float bayer(vec2 c){vec2 a=mod(c,4.);float x=a.x,y=a.y;float v=0.;'+
'float b0=mod(floor(x/2.)+floor(y/2.)*2.,4.);float m0=b0==0.?0.:b0==1.?2.:b0==2.?3.:1.;'+
'float c0=mod(x,2.)+mod(y,2.)*2.;float m1=c0==0.?0.:c0==1.?2.:c0==2.?3.:1.;'+
'return (m0*4.+m1+.5)/16.;}\n'+
/* tide height field: swells running up-right, warped, with a slow big tide */
'float field(vec2 u,float t){\n'+
' vec2 w=u;w.x+=.18*sin(u.y*3.1+t*.22)+.09*sin(u.y*7.3-t*.31);w.y+=.07*sin(u.x*4.2+t*.27);\n'+
' float a=sin((w.x*.9+w.y*1.7)*5.2-t*.55);\n'+
' float b=sin((w.x*1.4-w.y*.6)*9.1-t*.8+1.7)*.5;\n'+
' float c=sin((w.x*.3+w.y*2.2)*17.-t*1.3)*.22;\n'+
' float tide=.5+.5*sin(t*.12+w.x*1.2);\n'+
' return (a+b+c)*.32+.5+(tide-.5)*.3+(u.x-.5)*.35+(u.y-.5)*-.3-.08;}\n'+
'void main(){\n'+
' vec2 px=gl_FragCoord.xy;px.y=R.y-px.y;\n'+
' vec2 cid=floor(px/cell);vec2 lp=fract(px/cell);\n'+
' vec2 cc=(cid+.5)*cell/R;cc.x*=R.x/R.y;\n'+
' float asp=R.x/R.y;vec2 u=vec2(cc.x/asp,cc.y);u.x=cc.x*.55;\n'+
' float t=T;\n'+
' float f=field(vec2(cc.x*.6,cc.y*1.1),t);\n'+
' float tt=clamp(f,0.,1.);\n float ta=tt*tt*(3.-2.*tt);ta=mix(tt,ta,.6);\n'+
/* arc: 4 stops cerulean, iris deep/iris, rose, peach; pair chosen per cell */
' vec3 s0=H(26.,143.,192.),s1=H(182.,170.,255.),s2=H(244.,162.,192.),s3=H(248.,146.,138.);\n'+
' float q=ta*2.35;float seg=min(floor(q),2.);float fr=q-seg;\n'+
' vec3 A=seg<.5?s0:seg<1.5?s1:s2;vec3 B=seg<.5?s1:seg<1.5?s2:s3;\n'+
/* partitive: choose one of two pure inks by ordered threshold, never blend */
' float th=bayer(cid)*.8+h21(cid+floor(t*1.5))*.2*0.;\n'+
' vec3 ink=fr>th?B:A;\n'+
/* glyph: horizontal dash, length and thickness follow local slope of the swell (crest = long) */
' float crest=smoothstep(.25,.9,tt);\n'+
' float cov=.18+.8*pow(tt,.9);\n'+
' float len=mix(.30,.8,cov);float thick=mix(.14,.55,pow(cov,1.3));\n'+
' float yy=abs(lp.y-.5);float xx=abs(lp.x-.5)*2.;\n'+
' float g=step(yy,thick*.5)*step(xx,len);\n'+
/* rows where swell breaks: a second dash type, short vertical tick in the troughs */
' float tick=step(abs(lp.x-.5),.07)*step(abs(lp.y-.5),.38)*step(tt,.22);\n'+
' g=max(g,tick);\n'+
/* dissolve into ground at the low-left: sparse cells vanish */
' float keep=smoothstep(.02,.3,tt+.12)>h21(cid*1.7+7.)?1.:0.;\n'+
' g*=keep;\n'+
' vec3 ground=mix(H(6.,26.,46.),H(11.,42.,70.),smoothstep(0.,1.,cc.y*.0+tt*.6));\n'+
' o=vec4(mix(ground,ink,g),1.);}\n';
function sh(t,s){var x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x;}
var pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
var l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
var uR=gl.getUniformLocation(pr,'R'),uT=gl.getUniformLocation(pr,'T'),uC=gl.getUniformLocation(pr,'cell');
function size(){var d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d);gl.viewport(0,0,cv.width,cv.height);
 var cw=Math.max(8,Math.round(Math.min(innerWidth,innerHeight)/90))*d;gl.uniform2f(uC,cw,cw*1.8);gl.uniform2f(uR,cv.width,cv.height);}
addEventListener('resize',size);size();
var t0=performance.now();
function frame(){gl.uniform1f(uT,still?6.:(performance.now()-t0)/1000+6.);gl.drawArrays(gl.TRIANGLES,0,3);if(!still)requestAnimationFrame(frame);}
frame();
})();
</script></body></html>
