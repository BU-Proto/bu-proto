<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>23 tides / quadtree</title>
<style>html,body{margin:0;height:100%;background:#061a2e;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style>
</head><body><canvas id="c"></canvas>
<script src="../kit/palette.js"></script>
<script>
(function(){
'use strict';
var P=LabPalette, cv=document.getElementById('c'), ctx=cv.getContext('2d',{alpha:false});
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var GL=['.',':','-','=','+','x','*','#','%','@'], NC=28, AT=80;
/* size ramp: small = sky, medium = iris, big = rose, calm core = peach */
var ramp=[[0,'sky'],[0.34,'iris'],[0.72,'rose'],[1,'peach']];
function rampCol(t){var k=0;while(k<ramp.length-2&&t>ramp[k+1][0])k++;var a=ramp[k],b=ramp[k+1];return P.mix(a[1],b[1],Math.min(1,Math.max(0,(t-a[0])/(b[0]-a[0]))));}
/* atlas: glyph x colour step, tinted once */
var atlas=[];
(function(){for(var c=0;c<NC;c++){var col=P.toCss(rampCol(c/(NC-1))),row=[];
 for(var g=0;g<GL.length;g++){var a=document.createElement('canvas');a.width=a.height=AT;var x=a.getContext('2d');
  x.fillStyle=col;x.font='700 '+Math.round(AT*0.95)+'px ui-monospace,Menlo,Consolas,monospace';x.textAlign='center';x.textBaseline='middle';
  x.fillText(GL[g],AT/2,AT*0.54);row.push(a);}
 atlas.push(row);}
 /* frost + harbor variants for the blow-out and shadow passes */
 ['frost','mint'].forEach(function(n){var col=P.colors[n],row=[];for(var g=0;g<GL.length;g++){var a=document.createElement('canvas');a.width=a.height=AT;var x=a.getContext('2d');x.fillStyle=col;x.font='700 '+Math.round(AT*0.95)+'px ui-monospace,Menlo,Consolas,monospace';x.textAlign='center';x.textBaseline='middle';x.fillText(GL[g],AT/2,AT*0.54);row.push(a);}atlas[n]=row;});
})();
var gH=P.colors.harbor,gR=P.colors.raised,gR2=P.colors.raisedHi;
var W,H,dpr,t=0,MAXS,MINS,leaves=[];
function sm(a,b,x){x=(x-a)/(b-a);x=x<0?0:x>1?1:x;return x*x*(3-2*x);}
/* tide field: perspective swell bands, shoreline warp, foam at each crest, light from the horizon. 0..1 */
function field(px,py){
 var u=px/H, v=py/H*H/ H; v=py/H; // v 0 top (far) .. 1 bottom (near)
 var warp=0.05*Math.sin(u*3.1+t*0.35)+0.03*Math.sin(u*7.7-t*0.55+v*4)+0.02*Math.sin(u*15+t*0.9);
 var w=v+warp*(0.4+v);
 var ph=Math.pow(Math.max(w,0)+0.03,1.55)*17-t*0.55;
 var s=Math.sin(ph), f=ph-Math.floor(ph/6.2831853)*6.2831853;
 var body=0.22+0.34*(0.5+0.5*s);
 var foam=Math.exp(-Math.pow((f-1.45)*1.3,2))*0.62;           /* crest line, sharp = quadtree edge */
 var wash=sm(0.0,1,Math.sin(ph*0.5+1.2)*0.5+0.5)*0.12;
 var light=0.35+0.9*Math.exp(-Math.pow((v-0.16)*2.6,2));      /* sun path near the horizon */
 var glint=Math.exp(-Math.pow((u-0.62+0.08*Math.sin(t*0.3))*2.2/ (0.5+v),2))*0.35*sm(0.05,0.4,v);
 var sky=sm(0.0,0.16,v);                                      /* above the horizon: empty, calm */
 var val=(body*light+foam*(0.5+light*0.5)+wash+glint)*sky*(0.75+0.25*Math.min(1,v*3));
 return val>1?1:val;
}
function rec2(x,y,s){
 var h=s/2,a=field(x,y),b=field(x+s,y),c=field(x,y+s),d=field(x+s,y+s),e=field(x+h,y+h),
  f1=field(x+h,y),f2=field(x,y+h),f3=field(x+s,y+h),f4=field(x+h,y+s);
 var mn=Math.min(a,b,c,d,e,f1,f2,f3,f4),mx=Math.max(a,b,c,d,e,f1,f2,f3,f4),r=mx-mn;
 if(s>MINS&&(r>0.07+0.0009*s||s>MAXS)){rec2(x,y,h);rec2(x+h,y,h);rec2(x,y+h,h);rec2(x+h,y+h,h);return;}
 leaves.push(x,y,s,(a+b+c+d+e*2+f1+f2+f3+f4)/10,r);
}
function frame(){
 ctx.setTransform(1,0,0,1,0,0);
 var g=ctx.createLinearGradient(0,0,0,cv.height);g.addColorStop(0,gH);g.addColorStop(0.5,gR);g.addColorStop(1,gR2);
 ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 leaves.length=0;
 var root=MAXS;
 for(var y=0;y<H;y+=root)for(var x=0;x<W;x+=root)rec2(x,y,root);
 var n=leaves.length,lg2=Math.log(MAXS/MINS);
 var tipTone=-1,tipI=-1;
 for(var i=0;i<n;i+=5){
  var x0=leaves[i],y0=leaves[i+1],s=leaves[i+2],tone=leaves[i+3],r=leaves[i+4];
  var lvl=1-Math.log(s/MINS)/lg2;               /* 0 big .. 1 small */
  var ct=1-lvl;                                  /* 0 small(sky) .. 1 big(rose) */
  var ci=Math.round(Math.min(1,Math.max(0,ct*0.74+tone*0.06))*(NC-1));
  /* cell ground: big calm cells get a soft pool of the raised blue */
  if(tone>0.1){ctx.globalAlpha=Math.min(0.5,tone*0.55*(0.4+ct*0.6));ctx.fillStyle=ct>0.5?'#123a5c':'#0b2a46';ctx.fillRect(x0,y0,s,s);ctx.globalAlpha=1;}
  if(tone<0.06)continue;
  var gi,set=atlas[ci],pad=s*0.08;
  if(r>0.2&&s<=MINS*2.01){gi=(r>0.4)?3:2;}      /* edge cells: dashes that follow the crest */
  else gi=Math.min(GL.length-1,Math.floor(sm(0.06,1.1,tone)*(GL.length-1)));
  if(tone>0.9&&s>=MINS*2&&s<=MAXS/2){set=atlas.frost;gi=9;}       /* blow-out */
  else if(tone<0.2&&s<MAXS){ctx.globalAlpha=0.55;}   /* shadow: dimmer ticks */
  ctx.drawImage(set[gi],x0+pad,y0+pad,s-pad*2,s-pad*2);
  ctx.globalAlpha=1;
  if(r>0.3&&s<=MINS*1.01&&tone>tipTone&&((x0*7+y0*13|0)%97)===0){tipTone=tone;tipI=i;}
 }
 /* one live cell riding the foam: mint */
 var mx=((t*0.045)%1.2-0.1)*W, my=-1;
 var best=1e9;
 for(i=0;i<n;i+=5){if(leaves[i+2]>MINS*1.01||leaves[i+4]<0.25)continue;var dx=Math.abs(leaves[i]-mx);if(dx<best&&leaves[i+1]>H*0.3){best=dx;tipI=i;}}
 if(tipI>=0&&best<30){var s2=leaves[tipI+2]*1.4;ctx.drawImage(atlas.mint[7],leaves[tipI]-s2*0.2,leaves[tipI+1]-s2*0.2,s2,s2);}
}
function size(){
 dpr=Math.min(window.devicePixelRatio||1,1.5);W=window.innerWidth;H=window.innerHeight;
 cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
 var m=Math.max(W,H);MAXS=m>1600?128:64;if(W<700){MAXS=64;}
 MINS=W<700?6:(m>1600?8:6);if(MINS*4>MAXS)MINS=MAXS/8;
 MAXS=Math.pow(2,Math.round(Math.log(MAXS)/Math.LN2));
 MINS=MAXS/Math.pow(2,Math.round(Math.log(MAXS/MINS)/Math.LN2));
 if(reduce)frame();
}
window.addEventListener('resize',size);
size();
if(reduce){t=3.2;frame();}
else{t=3.2;var last=performance.now();(function loop(now){t+=Math.min(0.05,(now-last)/1000);last=now;frame();requestAnimationFrame(loop);})(last);}
})();
</script></body></html>
