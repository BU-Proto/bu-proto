<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>r1/43 tides: glyphs drawn from segments, no font</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;height:100%;background:#061a2e;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style>
</head><body><canvas id="c"></canvas>
<script src="../kit/palette.js"></script>
<script type="x-shader/x-fragment" id="fs">#version 300 es
precision highp float;
out vec4 o;
uniform vec2 R,CELL;
uniform float T;
uniform sampler2D ramp;
const vec3 H=vec3(.024,.102,.18),RS=vec3(.043,.165,.275),RH=vec3(.071,.227,.361),F=vec3(.965,.984,1.),
  MINT=vec3(.616,.941,.659),PEACH=vec3(.973,.573,.541),HAZE=vec3(.808,.757,.745),ROSE=vec3(.957,.635,.753);
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+1.),f.x),f.y);}
vec3 arc(float u){return texture(ramp,vec2(mix(.01,.99,clamp(u,0.,1.)),.5)).rgb;}
/* the sea. q: x in aspect units, y 0 top .. 1 bottom. returns shoreline depth, writes wave phase */
float sea(vec2 q,out float ph){
  float tide=sin(T*.13);
  float y0=.72+.05*tide+.045*sin(q.x*2.1+T*.11)+.03*(vn(vec2(q.x*2.6,T*.05))-.5);
  float d=y0-q.y;
  float warp=3.2*vn(vec2(q.x*1.5-T*.04,q.y*1.9+T*.02))+2.2*sin(q.x*2.4+q.y*3.+T*.08)+1.6*sin(q.x*5.1-q.y*2.+T*.15)*smoothstep(.5,.0,d);
  ph=9.*(-log(max(d,0.)+.055))-T*1.05+warp;
  return d;
}
/* distance to segment */
float sg(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;return length(pa-ba*clamp(dot(pa,ba)/dot(ba,ba),0.,1.));}
void main(){
  vec2 px=vec2(gl_FragCoord.x,R.y-gl_FragCoord.y);
  vec2 cell=floor(px/CELL),inC=px/CELL-cell;
  vec2 cc=(cell+.5)*CELL/R.y;                       /* cell centre, y 0..1 */
  float ph,ph1,ph2;
  float d=sea(cc,ph);
  float e=CELL.y/R.y;
  sea(cc+vec2(e,0),ph1); sea(cc+vec2(0,e),ph2);
  vec2 g=vec2(ph1-ph,ph2-ph);                       /* phase gradient: wave travel normal */
  vec2 n=g/max(length(g),1e-4);
  vec2 tg=vec2(-n.y,n.x);                           /* along the crest */
  float s=.5+.5*sin(ph);
  float amp=smoothstep(-.01,.1,d)*(.6+.4*smoothstep(.0,.5,.75-d));
  float swell=.75+.25*sin(ph*.23+cc.x*1.7);
  float hh=pow(s,1.05)*amp*swell;
  float hr=h21(cell+3.);
  /* glyph space: units of cell width, centred; y scaled so cells stay square-ish */
  vec2 p=(inC-.5)*CELL/CELL.x;
  float aa=1.1/CELL.x;
  vec3 bg=mix(H,RS,clamp(hh*.9+.1*(1.-d),0.,1.)*.55);
  vec3 col=bg;
  if(d>0.){
    /* sea: glyph chosen by wave height, turned to lie along the crest */
    vec2 q=vec2(dot(p,tg),dot(p,n));                /* q.x along crest, q.y along travel */
    float dist=9.; float w=.05+.06*hh;
    float lvl=hh;
    float dn=1.-smoothstep(.0,.2,cc.y-.04)*0.; /* keep */
    float top=smoothstep(.0,.16,cc.y+(vn(cc*9.)-.5)*.1);  /* top edge dissolves to ticks */
    lvl*=mix(.55,1.,top);
    if(lvl>.9){ dist=min(sg(q,vec2(-.36,0),vec2(.36,0)),sg(q,vec2(0,-.36),vec2(0,.36))); w+=.02; }
    else if(lvl>.74){ dist=min(sg(q,vec2(-.34,-.14),vec2(0,.16)),sg(q,vec2(.34,-.14),vec2(0,.16))); }
    else if(lvl>.56){ dist=min(sg(q,vec2(-.3,-.13),vec2(.3,-.13)),sg(q,vec2(-.3,.13),vec2(.3,.13))); }
    else if(lvl>.38){ dist=sg(q,vec2(-.38,0),vec2(.38,0)); }
    else if(lvl>.2){ dist=sg(q,vec2(-.17,0),vec2(.17,0)); w*=.9; }
    else if(hr<.16*(1.+2.*top)){ dist=sg(q,vec2(-.04,0),vec2(.04,0)); w=.07; }
    float k=1.-smoothstep(w-aa,w+aa,dist);
    float near=smoothstep(.45,.0,d);
    float u=.06+.78*hh+.2*near;
    vec3 ink=arc(u);
    ink=mix(ink,F,smoothstep(.86,1.,lvl)*.85+smoothstep(.1,.0,d)*.6);
    /* lagoon-lit troughs: dark ticks in the shadow, polarity flips with height */
    if(lvl<=.2&&hr>=.16){ float tk=1.-smoothstep(.05-aa,.05+aa,sg(q,vec2(-.2,0),vec2(.2,0))); col=mix(bg,RH,tk*.9*step(.55,hr)); }
    col=mix(col,ink,k);
  } else {
    /* the beach: swash dashes in peach and haze, thinning to nothing in the harbor */
    float wet=exp(d*5.5);
    float row=h21(vec2(cell.y,floor(T*.35+cell.y*.37)));
    float run=smoothstep(.0,1.,wet*1.25+(vn(vec2(cc.x*3.,cc.y*40.))-.5)*.6);
    float len=mix(.1,.42,run)*(.4+.6*h21(cell+9.));
    float live=step(hr,wet*.9+.04)*step(.28,row+wet*.5);
    float k=live*(1.-smoothstep(.05-aa,.05+aa,sg(p,vec2(-len,0),vec2(len,0))));
    vec3 ink=mix(HAZE,PEACH,smoothstep(.05,.8,wet));
    ink=mix(ink,F,smoothstep(.8,1.,wet)*.8);
    /* grid of block cells right at the waterline dissolving into dashes */
    float blk=smoothstep(.16,.0,-d)*step(hr,.75);
    float hs=.38*smoothstep(.0,.12,-d)*0.+.38*blk; vec2 ap=abs(p)*vec2(1.,1.2); float bk=step(.04,blk)*(1.-smoothstep(hs-aa,hs+aa,max(ap.x,ap.y*mix(1.,3.,1.-blk))));
    col=mix(col,ink,k);
    col=mix(col,mix(ROSE,F,.5),bk);
  }
  /* mint: one live cell riding the foam line */
  float mx=fract(T*.022)*R.x/R.y*1.0;
  float mph; float md=sea(vec2(mx,.5),mph);
  vec2 mc=floor(vec2(mx*R.y/CELL.x,(.72-md+0.)*0.));
  float my=.5-md; /* y of shoreline = .5 - md? sea() gives d=y0-y so y0=d+y */
  float shoreY=md+.5;
  vec2 mcell=floor(vec2(mx*R.y,shoreY*R.y)/CELL);
  if(cell==mcell){ float m=1.-smoothstep(.2-aa,.2+aa,abs(p.x)+abs(p.y)); col=mix(col,MINT,m); }
  o=vec4(col,1.);
}
</script>
<script>
(function(){
  var cv=document.getElementById('c'),gl=cv.getContext('webgl2',{antialias:false,alpha:false});
  if(!gl){document.body.style.background='#061a2e';return;}
  function sh(t,s){var x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x;}
  var pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,'#version 300 es\nvoid main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0.,1.);}'));
  gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent.replace(/^\s+/,'')));
  gl.linkProgram(pr);gl.useProgram(pr);
  var tex=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,256,1,0,gl.RGBA,gl.UNSIGNED_BYTE,LabPalette.lut(256));
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.uniform1i(gl.getUniformLocation(pr,'ramp'),0);
  var uR=gl.getUniformLocation(pr,'R'),uC=gl.getUniformLocation(pr,'CELL'),uT=gl.getUniformLocation(pr,'T');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){
    var dpr=Math.min(window.devicePixelRatio||1,2),w=Math.round(innerWidth*dpr),h=Math.round(innerHeight*dpr);
    cv.width=w;cv.height=h;gl.viewport(0,0,w,h);
    var cw=Math.max(8,Math.round(Math.min(innerWidth,innerHeight*1.4)/78))*dpr; /* scales with the viewport */
    gl.uniform2f(uR,w,h);gl.uniform2f(uC,cw,Math.round(cw*1.2));
  }
  function draw(t){gl.uniform1f(uT,t);gl.drawArrays(gl.TRIANGLES,0,3);}
  var t0=performance.now();
  function frame(){draw(14+(performance.now()-t0)/1000);requestAnimationFrame(frame);}
  addEventListener('resize',function(){size();if(reduce)draw(14);});
  size();
  if(reduce)draw(14);else frame();
})();
</script></body></html>
