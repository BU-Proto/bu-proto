<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>32 Misregistered Riso</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #061a2e; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../kit/palette.js"></script>
<script>
(function () {
  'use strict';
  var Pal = LabPalette, cv = document.getElementById('c');
  var gl = cv.getContext('webgl2', { antialias: false });
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var FONT = 'ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace';
  var RAMP = ' .:-+=*x#%@';       /* ordered by rough ink coverage */
  var N = RAMP.length;
  function v3(n) { var c = Pal.resolve(n); return c; }

  var vs = '#version 300 es\nin vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }';
  var fs = '#version 300 es\nprecision highp float;\n' +
  'uniform vec2 R; uniform float T; uniform float cw; uniform vec2 M; uniform sampler2D A; uniform float N;\n' +
  'uniform vec3 cHarbor,cRaised,cSky,cLagoon,cRose,cIris,cIrisD,cPeach,cFrost,cMint;\n' +
  'out vec4 o;\n' +
  'float h(vec2 q){ return fract(sin(dot(q,vec2(127.1,311.7)))*43758.5453); }\n' +
  'float vn(vec2 q){ vec2 i=floor(q),f=fract(q); f=f*f*(3.-2.*f);\n' +
  ' return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y); }\n' +
  'float fbm(vec2 q){ float s=0.,a=.5; for(int i=0;i<4;i++){ s+=a*vn(q); q=q*2.03+vec2(1.7,9.2); a*=.5; } return s; }\n' +
  /* the one shared plate: a drifting warped ridge field with a bright pool */
  'float plate(vec2 q,float t){\n' +
  ' vec2 w=vec2(fbm(q*1.3+vec2(0.,t*.05)),fbm(q*1.3+vec2(5.2,1.3)-t*.04));\n' +
  ' q+= (w-.5)*1.6;\n' +
  ' float r=fbm(q*1.5+t*.03);\n' +
  ' float ridge=1.-abs(2.*r-1.);\n' +
  ' float pool=exp(-dot(q-vec2(.15,.05),q-vec2(.15,.05))*.55);\n' +
  ' return clamp(pow(ridge,3.)*1.05+pool*.7-.38,0.,1.); }\n' +
  /* one print pass: own grid, own rotation, own offset; returns coverage */
  'float layer(vec2 fc,vec2 off,float rot,float scale,vec2 ctr,float t,vec2 ph,out float inkv){\n' +
  ' vec2 cs=vec2(cw*scale,cw*scale*2.);\n' +
  ' vec2 p=fc-off-.5*R; float c=cos(rot),s=sin(rot); p=mat2(c,-s,s,c)*p+.5*R;\n' +
  ' vec2 g=p/cs; vec2 id=floor(g); vec2 lc=fract(g);\n' +
  ' vec2 cc=(id+.5)*cs; vec2 q=(cc-ctr)/R.y*3.2+ph;\n' +
  ' float f=plate(q,t);\n' +
  ' float bay=h(id)*.6+.2;\n' +
  ' float idx=floor(clamp(f*(N-1.)*1.15+ (bay-.5)*.9,0.,N-1.)+.5);\n' +
  ' inkv=f;\n' +
  ' if(idx<.5) return 0.;\n' +
  ' vec2 uv=vec2((idx+lc.x)/N,1.-lc.y);\n' +
  ' return texture(A,uv).r; }\n' +
  'void main(){\n' +
  ' vec2 fc=gl_FragCoord.xy; fc.y=R.y-fc.y;\n' +
  ' vec2 m=M*R; if(M.x<0.) m=R*vec2(.5+.08*sin(T*.21),.5+.06*cos(T*.17));\n' +
  /* registration is perfect at the pointer, slips outward like a loose press */
  ' vec2 d=(fc-m)/R.y; float dl=length(d);\n' +
  ' vec2 slip=d*(.09+.04*sin(T*.3))*R.y*(.3+dl)+vec2(sin(T*.27+d.y*3.),cos(T*.23+d.x*3.))*cw*.8*smoothstep(.1,.7,dl);\n' +
  ' vec2 ph=vec2(.0);\n' +
  ' float ic,ip;\n' +
  ' float a=layer(fc,-slip*.5,-.014,1.0,m,T,ph+d*.06,ic);\n' +
  ' float b=layer(fc,slip*.5,.014,1.0,m,T,ph-d*.06+vec2(.04,0.),ip);\n' +
  ' vec2 uv=fc/R;\n' +
  ' vec3 ground=mix(cHarbor,cRaised,smoothstep(1.1,0.1,length((uv-vec2(.5,.45))*vec2(1.2,1.))));\n' +
  /* glyph edges dissolve at the frame via the plate itself; add soft vignette */
  ' float vig=smoothstep(.0,.16,uv.x)*smoothstep(1.,.84,uv.x)*.5+.5;\n' +
  ' float both=a*b;\n' +
  ' vec3 col=ground;\n' +
  ' vec3 cyan=mix(cSky,cLagoon,smoothstep(.2,.9,ic)*.6);\n' +
  ' vec3 pink=mix(cRose,cPeach,smoothstep(.75,1.,ip)*.5);\n' +
  ' vec3 vio=mix(cIrisD,cIris,smoothstep(.5,1.,(ic+ip)*.5)*.7);\n' +
  ' col=mix(col,cyan,a*(1.-b)*.92);\n' +
  ' col=mix(col,pink,b*(1.-a)*.92);\n' +
  ' col=mix(col,vio,smoothstep(.05,.45,both)*.95);\n' +
  /* hottest overlap blows out to frost */
  ' col=mix(col,cFrost,smoothstep(.82,1.,min(ic,ip))*both*.8);\n' +
  /* live mint tick at the registration point */
  ' vec2 md=(fc-m); float tick=step(abs(md.x),cw*.5)*step(abs(md.y),cw);\n' +
  ' col=mix(col,cMint,tick*(.6+.4*sin(T*5.)));\n' +
  ' o=vec4(col,1.); }';

  function sh(t, s) { var x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x);
    if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; }
  var pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(pr); gl.useProgram(pr);
  var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  function U(n) { return gl.getUniformLocation(pr, n); }

  /* glyph atlas, measured-order ramp, one row */
  var cwA = 32, chA = 64, ac = document.createElement('canvas'); ac.width = cwA * N; ac.height = chA;
  var ax = ac.getContext('2d'); ax.fillStyle = '#000'; ax.fillRect(0, 0, ac.width, chA);
  ax.fillStyle = '#fff'; ax.textAlign = 'center'; ax.textBaseline = 'middle'; ax.font = '40px ' + FONT;
  ax.save(); ax.scale(1, 1.75); for (var i = 1; i < N; i++) ax.fillText(RAMP[i], cwA * i + cwA / 2, chA / 3.5 + 1); ax.restore();
  var tex = gl.createTexture(); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, ac);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1i(U('A'), 0); gl.uniform1f(U('N'), N);
  [['cHarbor','harbor'],['cRaised','raised'],['cSky','sky'],['cLagoon','lagoon'],['cRose','rose'],['cIris','iris'],
   ['cIrisD','irisDeep'],['cPeach','peach'],['cFrost','frost'],['cMint','mint']].forEach(function (a) { gl.uniform3fv(U(a[0]), v3(a[1])); });

  var dpr, W, H, mx = -1, my = -1, cw = 9;
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = Math.round(innerWidth * dpr); H = Math.round(innerHeight * dpr);
    cv.width = W; cv.height = H; gl.viewport(0, 0, W, H);
    cw = Math.max(6, Math.round(Math.max(innerWidth, innerHeight) / 150)) * dpr;
    gl.uniform2f(U('R'), W, H); gl.uniform1f(U('cw'), cw);
  }
  addEventListener('resize', resize); resize();
  addEventListener('pointermove', function (e) { mx = e.clientX / innerWidth; my = e.clientY / innerHeight; });
  var uT = U('T'), uM = U('M');
  function frame(ms) {
    gl.uniform1f(uT, still ? 6 : ms / 1000);
    gl.uniform2f(uM, mx, my);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!still) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
