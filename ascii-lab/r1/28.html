<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r1/28 Partitive tide</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #061a2e; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../kit/palette.js"></script>
<script>
/* Partitive colour. Each 2x3-dot cell holds exactly two ink hues, neighbours on the arc
   (sky|iris|rose|peach|frost). No interpolated colour exists anywhere: the tide from sky to rose
   is only the ratio of the two pure inks, mixed by the eye at distance. Ink size grows with the
   arc (small sky, big rose) and thins to sparse dots where the tide dissolves into harbor. */
(function () {
  'use strict';
  var P = LabPalette;
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv = document.getElementById('c');
  var gl = cv.getContext('webgl2', { antialias: false });
  var vs = '#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  var fs = '#version 300 es\nprecision highp float;\n' +
  'uniform vec2 R;uniform float T,U;uniform vec3 K[5];uniform vec3 G;out vec4 o;\n' +
  'float h(vec2 p){p=fract(p*vec2(.1031,.1030));p+=dot(p,p.yx+33.33);return fract((p.x+p.y)*p.x);}\n' +
  'float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);\n' +
  ' return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}\n' +
  'float fb(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*n(p);p=p*2.03+7.1;a*=.5;}return s;}\n' +
  /* tide field: 0 sky .. 1 frost, rose-weighted */
  'float tide(vec2 q,float t){\n' +
  ' vec2 w=vec2(fb(q*1.6+vec2(0,t*.05)),fb(q*1.6+5.2-vec2(t*.04,0)));\n' +
  ' q+=.55*(w-.5);\n' +
  ' float s=dot(q,normalize(vec2(.55,-.85)))*.62+.46;\n' +
  ' s+=.035*sin(dot(q,vec2(5.,9.))+t*.7)+.05*(fb(q*3.+t*.03)-.5);\n' +
  ' float sun=exp(-dot(q-vec2(.95,-.3),q-vec2(.95,-.3))*5.);\n' +
  ' return clamp(s*.84+.12*sun,0.,1.);}\n' +
  'void main(){\n' +
  ' vec2 p=gl_FragCoord.xy; p.y=R.y-p.y;\n' +
  ' vec2 cs=vec2(14.,21.)*U, cell=floor(p/cs), loc=p-cell*cs;\n' +
  ' float asp=R.x/R.y; vec2 ctr=(cell+.5)*cs;\n' +
  ' vec2 q=(ctr/R.y)-vec2(asp*.5,.5); q.y=-q.y;\n' +
  ' float t=tide(q,T);\n' +
  /* pair of adjacent stops: only two hues in this cell */
  ' float sc=min(t,.999)*3.999; float k=floor(sc); float f=sc-k;\n' +
  ' f=clamp(f+(h(cell+3.7)-.5)*.16,0.,1.);\n' +
  ' vec3 A=K[int(k)],B=K[int(k)+1];\n' +
  /* density: sky end sparse, rose end full, left-top edge dissolves */
  ' float dens=smoothstep(.02,.62,t)*.8+.2;\n' +
  ' dens*=mix(.55,1.,smoothstep(-.1,.5,t+.2*fb(q*2.+9.)));\n' +
  ' vec2 dg=vec2(2.,3.); vec2 dp=loc/(cs/dg); vec2 di=floor(dp); vec2 dl=fract(dp)-.5;\n' +
  ' float th=h(cell*1.37+di*7.3+11.);\n' +
  ' float pick=step(th,f);\n' +
  ' vec3 ink=mix(A,B,pick);\n' +
  ' float keep=step(h(cell+di*.31+2.2),dens+.18);\n' +
  ' float rad=(.16+.30*dens)*(.8+.35*t);\n' +
  ' vec2 sh=dl*vec2(cs.x/dg.x,cs.y/dg.y)/(cs.x/dg.x);\n' +
  ' float d=length(sh);\n' +
  ' float aa=1./(cs.x/dg.x);\n' +
  ' float m=(1.-smoothstep(rad-aa,rad+aa,d))*keep;\n' +
  ' vec3 col=mix(G,ink,m);\n' +
  ' o=vec4(col,1.);}';
  function sh(t, s) { var x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x);
    if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(x)); return x; }
  var pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(pr); gl.useProgram(pr);
  var b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  var stops = ['sky', 'iris', 'rose', 'peach', 'frost'], flat = [];
  stops.forEach(function (s) { flat = flat.concat(P.resolve(s)); });
  gl.uniform3fv(gl.getUniformLocation(pr, 'K'), new Float32Array(flat));
  gl.uniform3fv(gl.getUniformLocation(pr, 'G'), new Float32Array(P.resolve('harbor')));
  var uR = gl.getUniformLocation(pr, 'R'), uT = gl.getUniformLocation(pr, 'T'), uU = gl.getUniformLocation(pr, 'U');
  var t0 = performance.now();
  function size() {
    var d = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(innerWidth * d); cv.height = Math.round(innerHeight * d);
    gl.viewport(0, 0, cv.width, cv.height);
    gl.uniform2f(uR, cv.width, cv.height); gl.uniform1f(uU, d * Math.max(0.75, Math.min(1.25, innerWidth / 1440)));
  }
  function draw(now) {
    gl.uniform1f(uT, still ? 4.0 : (now - t0) / 1000 + 4.0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    if (!still) requestAnimationFrame(draw);
  }
  addEventListener('resize', function () { size(); if (still) draw(0); });
  size(); requestAnimationFrame(draw);
})();
</script>
</body>
</html>
