<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>36 field / glyph bloom</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #061a2e; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../kit/palette.js"></script>
<script>
/* 36: field, glyph bloom. Veins of glyphs; only the densest cells emit.
   Pass 1 (cell resolution, MRT): field -> emission (mipmapped) + cell data (density, hue, emit).
   Pass 2 (pixel): glow is read from the mip pyramid and COLOURED BY RADIUS, not by source:
   near the vein it is peach and rose, further out iris, furthest cerulean, like a halo's spectrum.
   Glyphs sit on top; where they stand inside the light they turn to dark ticks against it. */
(function () {
  'use strict';
  var Pal = window.LabPalette, cv = document.getElementById('c');
  var gl = cv.getContext('webgl2', { antialias: false, alpha: false });
  if (!gl) { document.body.style.background = '#0b2a46'; return; }
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function c3(n) { var c = Pal.resolve(n); return c; }

  var VS = '#version 300 es\nvoid main(){vec2 p=vec2(gl_VertexID&1,gl_VertexID>>1&1)*2.;gl_Position=vec4(p*2.-1.,0,1);}';

  var NOISE = [
    'float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
    'float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);',
    ' return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}',
    'float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*vn(p);p=p*2.03+vec2(17.1,9.2);a*=.5;}return v/.96875;}'
  ].join('\n');

  /* ---------- pass 1: the field, at cell resolution ---------- */
  var FS1 = '#version 300 es\nprecision highp float;\n' + NOISE + '\n' + [
    'uniform vec2 grid;uniform float t,aspect;uniform vec3 ptr;uniform sampler2D lut;',
    'layout(location=0) out vec4 o0;layout(location=1) out vec4 o1;',
    'void main(){',
    ' vec2 c=gl_FragCoord.xy;',
    ' vec2 p=vec2((c.x-grid.x*.5)*aspect,c.y-grid.y*.5)/(grid.y*.5);',
    ' vec2 q=vec2(fbm(p*1.05+vec2(t*.031,0.)),fbm(p*1.05+vec2(5.2,1.3-t*.026)));',
    ' float n=fbm(p*1.55+2.3*q+vec2(t*.042,-t*.017));',
    ' float ridge=1.-abs(2.*n-1.);',
    ' float vein=pow(smoothstep(.62,1.,ridge),2.6);',
    ' float cloud=fbm(p*.75-q*1.4+vec2(0.,t*.02));',
    ' float d=vein*(.35+.9*smoothstep(.3,.75,cloud))+.12*smoothstep(.4,.8,cloud)*(.4+.6*n);',
    ' float breath=.5+.5*sin(t*.6+cloud*9.);',
    ' d*=.9+.12*breath;',
    ' vec2 pc=c-ptr.xy;pc.x*=aspect;float pd=exp(-dot(pc,pc)/(2.*9.*9.))*ptr.z;',
    ' d=clamp(d+.55*pd,0.,1.);',
    ' float e=smoothstep(.86,.99,d);',
    ' float hue=clamp(mix(.34,1.,fbm(p*.55+q*1.2+3.1))+.22*(d-.5),0.,1.);',
    ' vec3 ec=texture(lut,vec2(clamp(.78+.22*d,0.,1.),.5)).rgb;',
    ' o0=vec4(ec*e,e);',
    ' o1=vec4(d,hue,e,cloud);',
    '}'
  ].join('\n');

  /* ---------- pass 2: glow by radius, glyphs on top ---------- */
  var FS2 = '#version 300 es\nprecision highp float;\n' + [
    'uniform sampler2D emis,cell,atlas,lut;',
    'uniform vec2 res,cellPx,grid;uniform float t,nGlyph,plusIdx;uniform vec4 mintCells;',
    'uniform vec3 raspberry,harbor,raised,raisedHi,frost,irisDeep,peach,haze,mint;',
    'out vec4 o;',
    'vec3 arc(float x){return texture(lut,vec2(clamp(x,0.,1.),.5)).rgb;}',
    'float bayer(vec2 c){vec2 f=mod(c,4.);float a=mod(f.x,2.),b=mod(f.y,2.);',
    ' float i1=a*2.+b*3.-a*b*2.;float f2=floor(f.x*.5),g2=floor(f.y*.5);',
    ' return (i1*4.+(f2*2.+g2*3.-f2*g2*2.))/16.;}',
    'float hh(vec2 p){p=fract(p*vec2(.1031,.1030));p+=dot(p,p.yx+33.33);return fract((p.x+p.y)*p.x);}',
    'float lumo(vec3 c){return dot(c,vec3(.3,.55,.15));}',
    'void main(){',
    ' vec2 fc=gl_FragCoord.xy;',
    ' vec2 uvc=fc/(cellPx*grid);',
    ' ivec2 ci=ivec2(floor(fc/cellPx));',
    ' vec4 cd=texelFetch(cell,ci,0);',
    /* glow: each radius band reads its own mip and its own stop of the arc */
    ' vec2 dr=vec2(0.,-1.)/grid;',
    ' float s0=textureLod(emis,uvc,0.).a;',
    ' float s1=textureLod(emis,uvc+dr*.5,1.).a;',
    ' float s2=textureLod(emis,uvc+dr*1.2,2.).a;',
    ' float s3=(textureLod(emis,uvc+dr*2.4+vec2(.004,0.),3.).a+textureLod(emis,uvc+dr*2.4-vec2(.004,0.),3.).a)*.5;',
    ' float s4=(textureLod(emis,uvc+dr*4.5+vec2(.008,0.),4.).a+textureLod(emis,uvc+dr*4.5-vec2(.008,0.),4.).a)*.5;',
    ' float s5=(textureLod(emis,uvc+dr*8.,5.).a+textureLod(emis,uvc+dr*8.+vec2(0.,.02),5.).a)*.5;',
    ' float s6=textureLod(emis,uvc+dr*14.,6.).a;',
    ' vec3 g=vec3(0.);',
    ' g+=peach*s0*.5;',
    ' g+=arc(.86)*s1*.8;',
    ' g+=arc(.74)*s2*1.5;',
    ' g+=raspberry*s3*3.4;',
    ' g+=irisDeep*s4*3.0;',
    ' g+=mix(irisDeep,arc(.1),.5)*s5*2.6;',
    ' g+=arc(.05)*s6*1.4;',
    ' g=1.-exp(-g*.9);',
    /* ground */
    ' float vy=fc.y/res.y;',
    ' vec3 ground=mix(harbor,raised,.35*smoothstep(1.,0.,vy)+.1);',
    ' vec2 vq=(fc/res-.5);ground=mix(ground,harbor,smoothstep(.25,.85,length(vq*vec2(1.,1.1)))*.8);',
    ' vec3 col=1.-(1.-ground)*(1.-g*.85);',
    ' float gl=lumo(g);',
    /* glyph */
    ' float d=cd.r,hue=cd.g,e=cd.b;',
    ' float bay=bayer(vec2(ci));',
    ' float gi=floor(pow(d,.85)*nGlyph*.999+(bay-.5)*.9);',
    ' if(d<.07)gi=0.;',
    ' gi=clamp(gi,0.,nGlyph-1.);',
    ' vec2 lf=fract(fc/cellPx);',
    ' float cov=texture(atlas,vec2((gi+lf.x)/nGlyph,1.-lf.y)).r;',
    /* live cell (mint), on dark ground only */
    ' float mintOn=0.;',
    ' for(int k=0;k<2;k++){vec2 m=k==0?mintCells.xy:mintCells.zw;if(all(equal(vec2(ci),m))){mintOn=1.;}}',
    ' if(mintOn>.5){float gm=texture(atlas,vec2((plusIdx+lf.x)/nGlyph,1.-lf.y)).r;cov=max(cov,gm);}',
    ' float tInk=mix(hue,.1+.75*d,.55);',
    ' vec3 ink=arc(tInk);',
    ' ink=mix(ink,mix(peach,frost,smoothstep(.8,1.,d)),e*.85);',
    ' ink=mix(ink,frost,smoothstep(.86,1.,d));',
    ' float inLight=smoothstep(.1,.5,gl)*(1.-e);',
    ' vec3 deep=mix(irisDeep,harbor,smoothstep(.2,.55,gl));',
    ' ink=mix(ink,deep,inLight*.9);',
    ' ink=mix(ink,mint,mintOn*(1.-smoothstep(.15,.4,gl)));',
    ' float a=cov*smoothstep(.06,.3,d)*(.55+.45*smoothstep(.2,.7,d));',
    ' a=max(a,cov*mintOn);',
    ' col=mix(col,ink,clamp(a,0.,1.));',
    /* hot blocks: densest cells blow out */
    ' col=mix(col,frost,smoothstep(.95,1.,d)*cov*.5);',
    ' col+= (hh(fc+t)-.5)/255.;',
    ' o=vec4(col,1.);',
    '}'
  ].join('\n');

  function sh(type, src) {
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function prog(fs) {
    var p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }
  var P1 = prog(FS1), P2 = prog(FS2);
  function U(p, n) { return gl.getUniformLocation(p, n); }

  /* palette ramp */
  function tex(unit, filt) {
    var tx = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tx);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filt); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filt === gl.NEAREST ? gl.NEAREST : gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return tx;
  }
  var texLut = tex(3, gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 256, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, Pal.lut(256));

  var texEmis = tex(0, gl.LINEAR_MIPMAP_LINEAR), texCell = tex(1, gl.NEAREST), texAtlas = tex(2, gl.LINEAR);
  var fbo = gl.createFramebuffer();

  var st = { W: 0, H: 0, cw: 0, ch: 0, cols: 0, rows: 0, n: 1 };

  /* glyph atlas, ordered by measured coverage; the plus index feeds the live cell */
  var CHARS = ' .\'`,:;-~!|/+=<>^*xzcXY%&#$@▒█';
  function buildAtlas(cw, ch) {
    var m = document.createElement('canvas'), x = m.getContext('2d', { willReadFrequently: true });
    m.width = cw; m.height = ch;
    var list = [];
    for (var i = 0; i < CHARS.length; i++) {
      x.fillStyle = '#000'; x.fillRect(0, 0, cw, ch);
      x.fillStyle = '#fff'; x.font = '600 ' + Math.round(ch * 0.78) + 'px ui-monospace, Menlo, "SF Mono", monospace';
      x.textBaseline = 'alphabetic'; x.textAlign = 'center';
      var cc = CHARS.charAt(i);
      if (cc === '█') x.fillRect(Math.round(cw * 0.08), Math.round(ch * 0.1), Math.round(cw * 0.84), Math.round(ch * 0.8));
      else if (cc === '▒') { for (var yy = 0; yy < ch; yy += 2) for (var xx = (yy >> 1) & 1; xx < cw; xx += 2) x.fillRect(xx, yy, 1, 1); }
      else x.fillText(cc, cw / 2, ch * 0.76);
      var px = x.getImageData(0, 0, cw, ch).data, s = 0;
      for (var k = 0; k < px.length; k += 4) s += px[k];
      list.push({ c: cc, cov: s });
    }
    list.sort(function (a, b) { return a.cov - b.cov; });
    var plus = 0; list.forEach(function (g, i) { if (g.c === '+') plus = i; });
    var N = list.length, a = document.createElement('canvas'), ax = a.getContext('2d');
    a.width = cw * N; a.height = ch; ax.fillStyle = '#000'; ax.fillRect(0, 0, a.width, a.height);
    ax.fillStyle = '#fff'; ax.textAlign = 'center'; ax.textBaseline = 'alphabetic';
    ax.font = '600 ' + Math.round(ch * 0.78) + 'px ui-monospace, Menlo, "SF Mono", monospace';
    list.forEach(function (g, i) {
      if (g.c === '█') ax.fillRect(i * cw + Math.round(cw * 0.08), Math.round(ch * 0.1), Math.round(cw * 0.84), Math.round(ch * 0.8));
      else if (g.c === '▒') { for (var yy = 0; yy < ch; yy += 2) for (var xx = (yy >> 1) & 1; xx < cw; xx += 2) ax.fillRect(i * cw + xx, yy, 1, 1); }
      else ax.fillText(g.c, i * cw + cw / 2, ch * 0.76);
    });
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texAtlas);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, a);
    st.n = N; st.plus = plus;
  }

  function size() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = Math.max(1, Math.round(innerWidth * dpr)), H = Math.max(1, Math.round(innerHeight * dpr));
    var cwCss = Math.max(8, Math.min(14, Math.round(innerWidth / 130)));
    var cw = Math.round(cwCss * dpr), ch = Math.round(cwCss * 1.8 * dpr);
    cv.width = W; cv.height = H;
    st.W = W; st.H = H; st.cw = cw; st.ch = ch;
    st.cols = Math.ceil(W / cw); st.rows = Math.ceil(H / ch);
    buildAtlas(cw, ch);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texEmis);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, st.cols, st.rows, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texCell);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, st.cols, st.rows, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texEmis, 0);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, texCell, 0);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  var ptr = { x: -999, y: -999, z: 0, tz: 0 };
  function onMove(e) {
    var r = cv.getBoundingClientRect();
    ptr.x = (e.clientX - r.left) / r.width * st.cols;
    ptr.y = (1 - (e.clientY - r.top) / r.height) * (st.H / st.ch);
    ptr.tz = 1;
  }
  if (!still) {
    addEventListener('pointermove', onMove);
    addEventListener('pointerleave', function () { ptr.tz = 0; });
  }

  function frame(t) {
    ptr.z += (ptr.tz - ptr.z) * 0.08;
    /* pass 1 */
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, st.cols, st.rows);
    gl.useProgram(P1);
    gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, texLut);
    gl.uniform1i(U(P1, 'lut'), 3);
    gl.uniform2f(U(P1, 'grid'), st.cols, st.rows);
    gl.uniform1f(U(P1, 't'), t);
    gl.uniform1f(U(P1, 'aspect'), st.cw / st.ch);
    gl.uniform3f(U(P1, 'ptr'), ptr.x, ptr.y, ptr.z);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texEmis); gl.generateMipmap(gl.TEXTURE_2D);
    /* pass 2 */
    gl.viewport(0, 0, st.W, st.H);
    gl.useProgram(P2);
    gl.uniform1i(U(P2, 'emis'), 0); gl.uniform1i(U(P2, 'cell'), 1);
    gl.uniform1i(U(P2, 'atlas'), 2); gl.uniform1i(U(P2, 'lut'), 3);
    gl.uniform2f(U(P2, 'res'), st.W, st.H);
    gl.uniform2f(U(P2, 'cellPx'), st.cw, st.ch);
    gl.uniform2f(U(P2, 'grid'), st.cols, st.rows);
    gl.uniform1f(U(P2, 't'), t);
    gl.uniform1f(U(P2, 'nGlyph'), st.n); gl.uniform1f(U(P2, 'plusIdx'), st.plus);
    var step = Math.floor(t / 2.5);
    function cellAt(k) { return [Math.floor(hr(step * 3.1 + k) * st.cols), Math.floor(hr(step * 1.7 + k * 9.3) * st.rows)]; }
    function hr(x) { var s = Math.sin(x * 127.1) * 43758.5453; return s - Math.floor(s); }
    var m0 = cellAt(1), m1 = cellAt(2);
    gl.uniform4f(U(P2, 'mintCells'), m0[0], m0[1], m1[0], m1[1]);
    var names = { raspberry: 'raspberry', harbor: 'harbor', raised: 'raised', raisedHi: 'raisedHi', frost: 'frost', irisDeep: 'irisDeep', peach: 'peach', haze: 'haze', mint: 'mint' };
    Object.keys(names).forEach(function (k) { var c = c3(k); gl.uniform3f(U(P2, k), c[0], c[1], c[2]); });
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  /* the plus glyph's atlas index is passed through a constant: patch FS2 index 8 -> measured plus */
  /* (done at compile time below would need a rebuild; instead the atlas order is stable, so look it up once) */
  size();
  var rt;
  addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { size(); if (still) frame(14); }, 80); });
  if (still) { frame(14); return; }
  var t0 = performance.now();
  (function loop(ms) { frame(14 + ((ms || performance.now()) - t0) / 1000 * 0.9); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
