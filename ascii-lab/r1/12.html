<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>12 Field, stretched cells dissolving to dashes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #061a2e; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../kit/palette.js"></script>
<script src="../kit/subjects.js"></script>
<script>
/* 12: field. Wide stretched cells carry the arc (rose-led, peach core, frost blocks at the hottest point).
   Coverage falls toward the edges: blocks lose height, then become dashes whose length grows with distance, so the
   body trails off into long sparse strokes. Far dashes take the reflected arc (t' = 1 - t): sky around a rose mass.
   Rows drift at their own speed, so the dissolve reads as a tide being sorted into lines. One mint cell rides the frontier. */
(function () {
  'use strict';
  var S = window.LabSubjects, Pal = window.LabPalette;
  var cv = document.getElementById('c'), cx = cv.getContext('2d');
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var NT = 56, NA = 7;
  var W, H, dpr, cw, ch, cols, rows, hA, hB, hC, styles, frostS, mintS, harborC = Pal.resolve('harbor');

  function sm(a, b, x) { x = Math.max(0, Math.min(1, (x - a) / (b - a))); return x * x * (3 - 2 * x); }

  function build() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.floor(innerWidth * dpr)); H = Math.max(1, Math.floor(innerHeight * dpr));
    cv.width = W; cv.height = H;
    cw = Math.max(9, Math.round(innerWidth / 84)) * dpr; ch = Math.round(cw * 0.7);
    cols = Math.ceil(W / cw) + 1; rows = Math.ceil(H / ch);
    hA = new Float32Array(cols * rows); hB = new Float32Array(cols * rows); hC = new Float32Array(rows);
    for (var i = 0, s = 424242; i < hA.length; i++) {
      s = (Math.imul(s, 1664525) + 1013904223) >>> 0; hA[i] = s / 4294967296;
      s = (Math.imul(s, 1664525) + 1013904223) >>> 0; hB[i] = s / 4294967296;
    }
    for (var r = 0; r < rows; r++) { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; hC[r] = s / 4294967296; }
    /* colour table: NT arc stops x NA fades toward harbor */
    styles = [];
    for (var t = 0; t < NT; t++) {
      var c = Pal.arc(t / (NT - 1)), row = [];
      for (var a = 0; a < NA; a++) {
        var f = (a + 1) / NA;
        row.push(Pal.toCss([harborC[0] + (c[0] - harborC[0]) * f, harborC[1] + (c[1] - harborC[1]) * f, harborC[2] + (c[2] - harborC[2]) * f]));
      }
      styles.push(row);
    }
    frostS = Pal.toCss(Pal.resolve('frost')); mintS = Pal.toCss(Pal.resolve('mint'));
  }

  function frame(time) {
    cx.fillStyle = '#061a2e'; cx.fillRect(0, 0, W, H);
    var asp = W / H, ax = Math.sqrt(asp) * 1.15, gap = Math.max(1, Math.round(dpr));
    var mintBest = -1, mintX = 0, mintY = 0, mintW = 0;
    for (var r = 0; r < rows; r++) {
      var py = r * ch, y = -((py + ch / 2) / H - 0.5) * 2;
      var speed = (0.4 + hC[r] * 1.2) * 0.9;
      var drift = (time * speed * 0.25) % 1;          /* cells per second, per row */
      for (var c = 0; c < cols; c++) {
        var i = r * cols + c, px = c * cw;
        var x = ((px + cw / 2) / W - 0.5) * 2 * ax;
        /* body: tilted ellipse, warped by flowing noise and a slow swell */
        var wx = x + 0.62 * (S.fbm(x * 1.1 + time * 0.05, y * 1.3 + 3, 3) - 0.5) + 0.07 * Math.sin(y * 3.2 + time * 0.6);
        var wy = y + 0.55 * (S.fbm(x * 1.2 + 9, y * 1.1 - time * 0.04, 3) - 0.5) + 0.05 * Math.sin(x * 2.6 - time * 0.5);
        var u = (wx - 0.18 * ax) * 0.94 + (wy + 0.05) * 0.34, v = -(wx - 0.18 * ax) * 0.34 + (wy + 0.05) * 0.94;
        var d = Math.sqrt((u / (0.95 * ax * 0.72)) * (u / (0.95 * ax * 0.72)) + (v / 0.62) * (v / 0.62));
        var m = 1.12 - d;                                   /* >1 core, 0 edge, <0 outside */
        var cov = sm(-0.35, 0.62, m);                       /* 0..1 */
        var hue = 0.10 + 0.50 * sm(-0.2, 1.0, m) + 0.34 * ((wx / ax) * 0.55 + wy * 0.45 + 0.5) * sm(-0.6, 0.6, m) + 0.08 * Math.sin(time * 0.3 + wy * 2 + wx);
        hue = Math.max(0, Math.min(1, hue));
        var rr = hA[i], rb = hB[i];
        var x0 = px, w, h, y0, fill, a;
        if (cov > 0.62) {
          /* block: full stretched cell, sub-cell gap, height eases in */
          var k = (cov - 0.62) / 0.38;
          w = cw - gap; h = Math.max(gap + 1, (ch - gap * 2) * (0.55 + 0.45 * k)); y0 = py + (ch - h) / 2;
          a = NA - 1; var t = hue;
          if (m > 1.0) { t = Math.min(0.92, hue + (m - 1.0) * 0.9); }
          fill = styles[Math.round(t * (NT - 1))][a];
          if (m > 1.16 + 0.1 * rr) fill = frostS;
          else if (k < 0.5) fill = styles[Math.round(t * (NT - 1))][Math.max(2, Math.round(a * (0.5 + k)))];
          cx.fillStyle = fill; cx.fillRect(x0, y0, w, h);
        } else if (cov > 0.2) {
          /* bar: height collapses, width thins, vertical bias per cell so rows shear */
          var k2 = (cov - 0.2) / 0.42;
          if (rr > 0.25 + k2 * 0.7) continue;
          w = cw * (0.35 + 0.65 * k2) - gap; h = Math.max(gap, Math.round(ch * (0.12 + 0.5 * k2)));
          x0 = px + (cw - w) * rb; y0 = py + (ch - h) / 2;
          var tb = 1 - (1 - hue) * 0.9 + (1 - k2) * (1 - 2 * hue) * 0.35;
          cx.fillStyle = styles[Math.round(Math.max(0, Math.min(1, tb)) * (NT - 1))][Math.max(2, Math.round(2 + 4 * k2))];
          cx.fillRect(x0, y0, w, h);
        } else {
          /* dissolve: sparse dashes, length grows with distance, drifting along the row */
          var far = 1 - cov / 0.2;                          /* 0 near, 1 far */
          var pr = 0.05 + 0.5 * (1 - far) * (1 - far);
          if (rr > pr) continue;
          var len = cw * (0.45 + (0.8 + 3.2 * hB[(i * 7 + 3) % hB.length]) * far);
          var sx = px + ((rb + drift * (c % 2 ? 1 : 1)) % 1) * cw;
          h = Math.max(gap, Math.round(dpr * (1 + far))); y0 = py + Math.round(ch * (0.35 + 0.3 * hA[(i * 5 + 1) % hA.length]));
          var tc = 1 - hue;                                  /* reflected arc: sky around rose */
          var al = Math.max(1, Math.round((1 - far * 0.55) * (NA - 1) * (0.5 + rr)));
          cx.fillStyle = styles[Math.round(Math.max(0, Math.min(1, tc * 0.55)) * (NT - 1))][Math.min(NA - 1, al)];
          cx.fillRect(sx, y0, len, h);
          /* mint candidate: farthest-out dash that is also live (one per frame, slowly rotating) */
          var sc = rr * 1000 + Math.floor(time * 0.5) * 17;
          if (far > 0.1 && far < 0.6 && ((i * 31 + Math.floor(time * 0.7) * 977) % 5113) === 0) { mintBest = 1; mintX = sx; mintY = y0; mintW = len; }
        }
      }
    }
    if (mintBest > 0) { cx.fillStyle = mintS; cx.fillRect(mintX, mintY - 1, Math.min(mintW, cw * 1.4), Math.max(gap * 2, 2 * dpr)); }
  }

  function loop(ms) { frame(ms / 1000); requestAnimationFrame(loop); }
  function start() {
    build();
    if (still) frame(4.2); else requestAnimationFrame(loop);
  }
  var rt; addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { build(); if (still) frame(4.2); }, 80); });
  start();
})();
</script>
</body>
</html>
